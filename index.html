      // AUTHENTICATION HANDLER

        const backupData = {

          watchStudents,
          exportDate: new Date().toISOString()

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));

        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `OKCPS_Threat_Backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.cases && Array.isArray(imported.cases)) {
              setCases(imported.cases);
              if (imported.watchStudents) setWatchStudents(imported.watchStudents);
              alert("System Data Restored Successfully!");
            } else {
              alert("Invalid backup file format.");
            }
          } catch (err) {
            alert("Error reading file: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      // Filtered Categories
      const activeMediumHighCases = cases.filter(c => c.triageCompleted && (c.triagePriority === 'Medium' || c.triagePriority === 'High') && c.caseStatus !== 'Closed');
      const casesOnPlan = cases.filter(c => c.caseStatus !== 'Closed' && ((c.cstagClassification && c.cstagClassification !== 'Not-a-Threat' && c.cstagClassification !== 'Pending Assessment') || (c.planStartDate && c.planStartDate.trim() !== '') || c.planDoc !== null));
      const lowRiskCases = cases.filter(c => c.triageCompleted && c.triagePriority === 'Low' && c.caseStatus !== 'Closed');
      const openNoTriageCases = cases.filter(c => !c.triageCompleted && c.caseStatus !== 'Closed');
      const closedCases = cases.filter(c => c.caseStatus === 'Closed');
      const openCasesOnly = cases.filter(c => c.caseStatus !== 'Closed');

      const isStudentOnWatchList = (name, id) => {

        const currentStudent = watchStudents.find(st => st.studentId === studentId);

        const newDate = prompt("Enter new Last Updated date:", currentStudent.lastUpdatedDate);

          setWatchStudents(watchStudents.map(st => st.studentId === studentId ? { ...st, lastUpdatedDate: newDate.trim() } : st));
        }
      };

      const handleDeleteDocument = (category, docId) => {
        if (!currentCase) return;
        if (!window.confirm("Are you sure you want to delete this document from the 360-degree vault?")) return;

        setCases(cases.map(c => {
          if (c.id === currentCase.id) {
            const currentCatDocs = c.documents?.[category] || [];
            const updatedDocs = currentCatDocs.filter(d => d.id !== docId && d.name !== docId);
            return {
              ...c,
              documents: { ...c.documents, [category]: updatedDocs }
            };
          }
          return c;
        }));
      };

      const lookupResults = searchQuery.trim() === '' ? [] : cases.filter(c => {
        const q = searchQuery.toLowerCase();
        return (
          c.studentName.toLowerCase().includes(q) ||
          c.studentId.toLowerCase().includes(q) ||
          (c.involvedStudents && c.involvedStudents.toLowerCase().includes(q))

      const handleTipsFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileUrl = URL.createObjectURL(file);
        setUploadedTipsFile({ file, url: fileUrl, name: file.name });
        setIsParsingPdf(true);

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';

          for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + ' ';
          }

          let extractedName = '';
          let extractedId = '';
          let extractedGrade = '';
          let extractedSchool = '';
          let extractedTips = '';
          let extractedBrief = '';
          let extractedInvolved = '';
          let extractedDate = '';
          let extractedVictim = '';

          const nameMatch = fullText.match(/(?:Student Name|Subject|Student|Name):\s*([A-Za-z\s-]+?)(?=\s+(?:ID|Grade|School|TIPS|Date|DOB|$))/i);
          const idMatch = fullText.match(/(?:Student ID|ID #|ID|STU ID):\s*(\d{5,8})/i);
          const gradeMatch = fullText.match(/(?:Grade|Grade Level):\s*([0-9]{1,2}(?:th|rd|st|nd)?\s*Grade|[0-9]{1,2})/i);
          const schoolMatch = fullText.match(/(?:School|Campus|Location):\s*([A-Za-z0-9\s.-]+?)(?=\s+(?:TIPS|Report|ID|Date|$))/i);
          const tipsMatch = fullText.match(/(?:TIPS Report #|TIPS #|Incident #|Report #):\s*(26-\d{4,5}|\d{5,7})/i);
          const briefMatch = fullText.match(/(?:Brief|Threat Description|Incident Details|Details):\s*([\s\S]{10,250}?)(?=\s+(?:Action|Reported|Witness|$))/i);
          const involvedMatch = fullText.match(/(?:Involved Students|Other Students|Associated Students|Witnesses):\s*([A-Za-z0-9\s.,()-]+?)(?=\s+(?:Brief|Details|Action|$))/i);
          const dateMatch = fullText.match(/(?:Incident Date|Date of Incident|Date):\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4})/i);
          const victimMatch = fullText.match(/(?:Victim|Target|Victim Name):\s*([A-Za-z\s-]+?)(?=\s+(?:Role|Student|ID|Date|$))/i);

          if (nameMatch) extractedName = nameMatch[1].trim();
          if (idMatch) extractedId = idMatch[1].trim();
          if (gradeMatch) extractedGrade = gradeMatch[1].trim();
          if (schoolMatch) extractedSchool = schoolMatch[1].trim();
          if (tipsMatch) extractedTips = tipsMatch[1].trim();
          if (briefMatch) extractedBrief = briefMatch[1].trim();
          if (involvedMatch) extractedInvolved = involvedMatch[1].trim();
          if (dateMatch) extractedDate = dateMatch[1].trim();
          if (victimMatch) extractedVictim = victimMatch[1].trim();

          if (!extractedName || !extractedSchool) {
            const cleanName = file.name.replace('.pdf', '').replace(/_/g, ' ').replace(/-/g, ' ');
            extractedName = extractedName || cleanName;
            extractedId = extractedId || Math.floor(100000 + Math.random() * 900000).toString();
            extractedGrade = extractedGrade || '9th Grade';
            extractedSchool = extractedSchool || 'OKCPS Campus';
            extractedTips = extractedTips || `26-${Math.floor(1000 + Math.random() * 9000)}`;
            extractedBrief = extractedBrief || 'TIPS Incident report uploaded. Ready for review.';
            extractedInvolved = extractedInvolved || 'None listed';
            extractedDate = extractedDate || new Date().toISOString().split('T')[0];
          }

          setIntakeStudentName(extractedName);
          setIntakeStudentId(extractedId);
          if (extractedGrade) setIntakeStudentGrade(extractedGrade.includes('Grade') ? extractedGrade : `${extractedGrade}th Grade`);
          setIntakeSchool(extractedSchool);
          setIntakeTipsNum(extractedTips);
          setIntakeBrief(extractedBrief);
          setIntakeInvolvedStudents(extractedInvolved);
          if (extractedVictim) setIntakeVictimName(extractedVictim);
          if (extractedDate) setIntakeIncidentDate(extractedDate);
        } catch (err) {
          console.warn('PDF Parsing fallback engaged:', err);
        } finally {
          setIsParsingPdf(false);
        }
      };

      const handleTriageFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileUrl = URL.createObjectURL(file);
        setUploadedTriageFile({ file, url: fileUrl, name: file.name });

        const fname = file.name.toUpperCase();
        if (fname.includes('HIGH')) setDetectedTriageScore('High');
        else if (fname.includes('MED')) setDetectedTriageScore('Medium');
        else if (fname.includes('LOW')) setDetectedTriageScore('Low');
        else setDetectedTriageScore('High');
      };

      const handleFileUpload = (category, e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const isImage = file.type.startsWith('image/');
        const newDoc = {
          id: `doc-${Date.now()}`,
          name: file.name,
          uploadDate: new Date().toISOString().split('T')[0],
          size: `${(file.size / 1024).toFixed(0)} KB`,
          url: fileUrl,
          isImage: isImage
        };

        setCases(cases.map(c => {
          if (c.id === currentCase.id) {
            return {
              ...c,
              documents: {
                ...c.documents,
                [category]: [...(c.documents[category] || []), newDoc]
              }
            };
          }
          return c;
        }));
      };

      const handleAddWatchStudent = (e) => {
        e.preventDefault();
        const newStudent = {
          studentName: watchName.trim(),
          studentId: watchId.trim(),
          schoolLocation: watchSchool.trim(),
          lastUpdatedDate: new Date().toLocaleDateString('en-US'),
          incidents: [
            {
              id: `inc-${Date.now()}`,
              tipsNum: watchTipsNum.trim() || 'Pending',
              details: watchDetails.trim() || 'No initial details logged.',
              date: watchDate,
              triage: watchTriage,
              resolution: watchResolution.trim() || 'Pending action',
              notes: watchNotes.trim() || 'No initial notes.',
              tipsDoc: null,
              recordsDocs: []
            }
          ]
        };

        setWatchStudents([newStudent, ...watchStudents]);
        setShowAddWatchModal(false);
        setWatchName(''); setWatchId(''); setWatchSchool(''); setWatchTipsNum(''); setWatchDetails(''); setWatchResolution(''); setWatchNotes('');
      };

      const handleAddWatchIncident = (studentId) => {
        const tipsNum = prompt("Enter TIPS Report # for this new incident:");
        if (!tipsNum) return;

        const details = prompt("Enter Incident Details / Threat Description:");
        const date = prompt("Enter Incident Date:", new Date().toLocaleDateString('en-US'));
        const triage = prompt("Enter Triage Status:", "Low-Risk");
        const resolution = prompt("Enter Resolution / Action Taken:");
        const notes = prompt("Enter Notes / Update details:");

        const newIncident = {
          id: `inc-${Date.now()}`,
          tipsNum: tipsNum,
          details: details || 'No details provided',
          date: date || new Date().toLocaleDateString('en-US'),
          triage: triage || 'Low-Risk',
          resolution: resolution || 'Pending',
          notes: notes || 'None',
          tipsDoc: null,
          recordsDocs: []
        };

        setWatchStudents(watchStudents.map(st => {
          if (st.studentId === studentId) {
            return {
              ...st,
              lastUpdatedDate: new Date().toLocaleDateString('en-US'),
              incidents: [...st.incidents, newIncident]
            };
          }
          return st;
        }));
      };

      const handleCstagDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagDoc: newDoc } : c));
      };

      const handlePlanDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, planDoc: newDoc } : c));
      };

      const handleCstagChange = (classification) => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? {
          ...c,
          cstagClassification: classification,
          planStatus: (classification === 'Not-a-Threat') ? 'Not Completed' : (c.planStatus === 'Not Completed' ? 'Waiting on team to schedule' : c.planStatus)
        } : c));
      };

      const toggleImmediateCheck = (field) => {
        if (!currentCase) return;
        const currentChecks = currentCase.immediateResponse || { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false };
        const updatedChecks = { ...currentChecks, [field]: !currentChecks[field] };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, immediateResponse: updatedChecks } : c));
      };

      const updatePlanDetail = (field, val) => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, [field]: val } : c));
      };

      const handleAddPathwayEvent = (e) => {
        e.preventDefault();
        if (!newEventDesc.trim() || !currentCase) return;
        const newEvent = { id: Date.now(), stage: newEventStage, description: newEventDesc, date: newEventDate, moveNote: '' };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: [...(c.pathwayEvents || []), newEvent] } : c));
        setShowAddPathwayModal(false);
        setNewEventDesc('');
      };

      const handleOpenMoveEventModal = (evt) => {
        setEditingPathwayEvent(evt);
        setMoveTargetStage(evt.stage);
        setMoveReasonNote(evt.moveNote || '');
      };

      const handleSaveMovedPathwayEvent = (e) => {
        e.preventDefault();
        if (!editingPathwayEvent || !currentCase) return;

        const updatedEvents = (currentCase.pathwayEvents || []).map(evt => {
          if (evt.id === editingPathwayEvent.id) {
            return {
              ...evt,
              stage: moveTargetStage,
              moveNote: moveReasonNote.trim() ? `Moved to ${moveTargetStage} on ${new Date().toISOString().split('T')[0]}: "${moveReasonNote.trim()}"` : evt.moveNote
            };
          }
          return evt;
        });

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: updatedEvents } : c));
        setEditingPathwayEvent(null);
        setMoveReasonNote('');
      };

      // FIXED CASE CREATION & INTaKE STATE BINDING
      const handleCreateCase = (e) => {
        e.preventDefault();

        const existingOpenCase = cases.find(c => 
          c.caseStatus !== 'Closed' && 
          ((intakeStudentId.trim() !== '' && c.studentId === intakeStudentId.trim()) ||
           (intakeStudentName.trim() !== '' && c.studentName.toLowerCase() === intakeStudentName.trim().toLowerCase()))
        );

        const newTipsDoc = uploadedTipsFile ? { name: uploadedTipsFile.name, url: uploadedTipsFile.url } : { name: `TIPS_${intakeTipsNum}.pdf`, url: createMockPdfBlobUrl(`TIPS ${intakeTipsNum}`, intakeBrief) };

        if (existingOpenCase) {
          const newTipsEntry = {
            tipsNum: intakeTipsNum || `26-${Math.floor(1000 + Math.random() * 9000)}`,
            incidentDate: intakeIncidentDate || new Date().toISOString().split('T')[0],
            brief: intakeBrief || 'New TIPS Intake appended.',
            doc: newTipsDoc
          };

          const newRecordsDoc = {
            id: `doc-merged-${Date.now()}`,
            name: newTipsDoc.name,
            uploadDate: new Date().toISOString().split('T')[0],
            size: '1.2 MB',
            url: newTipsDoc.url,
            isImage: false
          };

          setCases(cases.map(c => {
            if (c.id === existingOpenCase.id) {
              return {
                ...c,
                additionalTipsList: [...(c.additionalTipsList || []), newTipsEntry],
                documents: {
                  ...c.documents,
                  recordsReview: [...(c.documents.recordsReview || []), newRecordsDoc]
                }
              };
            }
            return c;
          }));

          setSelectedCaseId(existingOpenCase.id);
          setShowNewIntakeModal(false);
          alert(`Automated Merge Complete: TIPS #${newTipsEntry.tipsNum} has been added directly to ${existingOpenCase.studentName}'s open case file.`);
          return;
        }

        const isTriageProvided = !!uploadedTriageFile;
        const finalPriority = isTriageProvided ? detectedTriageScore : 'Pending Triage';

        // PROPER BINDING OF VICTIM, INVOLVED PEERS, AND INCIDENT DATE
        const newCase = {
          id: intakeTipsNum || `26-${Math.floor(1000 + Math.random() * 9000)}`,
          studentName: intakeStudentName || 'New Student',
          studentId: intakeStudentId || '000000',
          studentGrade: intakeStudentGrade || '9th Grade',
          schoolLocation: intakeSchool || 'OKCPS Campus',
          victimName: intakeVictimName.trim() !== '' ? intakeVictimName.trim() : 'None Listed',
          victimRole: intakeVictimRole || 'Student',
          victimOtherRoleDetails: intakeVictimRole === 'Other' ? intakeVictimOtherRoleDetails : '',
          involvedStudents: intakeInvolvedStudents.trim() !== '' ? intakeInvolvedStudents.trim() : 'None Listed',
          tovBrief: intakeBrief || 'No description provided.',
          caseTeamStatusNotes: '',
          caseTeamStatusLastUpdated: new Date().toISOString().split('T')[0],
          incidentDate: intakeIncidentDate || new Date().toISOString().split('T')[0],
          dateReported: new Date().toISOString().split('T')[0],
          tipsReportNum: intakeTipsNum || 'Pending',
          triagePriority: finalPriority,
          triageCompleted: isTriageProvided,
          cstagClassification: !isTriageProvided ? 'Pending Assessment' : finalPriority === 'Low' ? 'Not-a-Threat' : 'Serious Substantive Threat',
          cstagDoc: null,
          immediateResponse: { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false },
          planStatus: 'Waiting on team to schedule',
          planDoc: null,
          planStartDate: '',
          planEndDate: '',
          planCheckinDate: '',
          isIep: intakeIsIep,
          suspended: intakeSuspended,
          reEntryDate: intakeSuspended ? (intakeReEntryDate || 'Pending') : 'N/A',
          caseStatus: 'Active',
          closeDate: '',
          closeNotes: '',
          additionalTipsList: [],
          intakeFiles: {
            tipsPdf: uploadedTipsFile ? { name: uploadedTipsFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '1.2 MB', url: uploadedTipsFile.url } : null,
            triagePdf: uploadedTriageFile ? { name: uploadedTriageFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '540 KB', scoreDetected: finalPriority, url: uploadedTriageFile.url } : null
          },
          documents: { studentInterview: [], parentInterview: [], witnessStatements: [], recordsReview: [] },
          pathwayEvents: (isTriageProvided && finalPriority !== 'Low') ? [{ id: Date.now(), stage: 'Grievance', description: `Initial threat logged via TIPS #${intakeTipsNum}`, date: intakeIncidentDate || new Date().toISOString().split('T')[0], moveNote: '' }] : []
        };

        setCases([newCase, ...cases]);
        setSelectedCaseId(newCase.id);
        setShowNewIntakeModal(false);

        setUploadedTipsFile(null);
        setUploadedTriageFile(null);
        setDetectedTriageScore('Pending Triage');
        setIntakeStudentName(''); setIntakeStudentId(''); setIntakeStudentGrade('9th Grade'); setIntakeSchool(''); setIntakeBrief(''); setIntakeTipsNum(''); setIntakeInvolvedStudents('');
        setIntakeVictimName(''); setIntakeVictimRole('Student'); setIntakeVictimOtherRoleDetails('');
        setIntakeIsIep(false); setIntakeSuspended(false); setIntakeReEntryDate('');

        if (!isTriageProvided) setMainTab('noTriage');
        else if (finalPriority === 'Low') setMainTab('low');
        else setMainTab('active');
      };

      const handleConfirmCloseCase = () => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? { 
          ...c, 
          caseStatus: 'Closed', 
          closeDate: closeCaseDate, 
          closeNotes: closeCaseNotes 
        } : c));
        setShowCloseCaseModal(false); 
        setCloseCaseNotes(''); 
        setMainTab('closed');
      };

      const selectCaseFromSearch = (c) => {
        setSelectedCaseId(c.id);
        if (c.caseStatus === 'Closed') setMainTab('closed');
        else if (!c.triageCompleted) setMainTab('noTriage');
        else if (c.triagePriority === 'Low') setMainTab('low');
        else setMainTab('active');
      };

      const openDocViewer = (doc) => {
        setViewingDoc(doc);
        setZoomLevel(1);
        setIsFullscreen(false);
      };

      const getPlanStatusStyle = (statusName) => {
        const found = PLAN_STATUS_OPTIONS.find(p => p.label === statusName);
        return found ? found.color : 'bg-slate-800 text-slate-200 border-slate-700';
      };

      // 🔑 PASSCODE LOGIN SCREEN OVERLAY
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4">
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="p-3 bg-blue-600/20 text-blue-400 rounded-xl inline-block font-bold text-2xl">🔒</div>
                <h1 className="text-lg font-bold text-slate-100">OKCPS Threat Assessment</h1>
                <p className="text-xs text-slate-400">System Security Lockout Active</p>
              </div>

              {passcodeError && (
                <div className="bg-red-950/80 border border-red-800 text-red-200 p-3 rounded-lg text-xs font-semibold text-center animate-bounce">
                  Incorrect System Passcode. Try Again.
                </div>
              )}

              <form onSubmit={handleAuthenticate} className="space-y-4 text-xs">
                <div>
                  <label className="text-slate-400 block mb-1.5 font-semibold">Enter General System Passcode</label>
                  <input
                    type="password"
                    required
                    value={inputPasscode}
                    onChange={(e) => setInputPasscode(e.target.value)}
                    placeholder="••••••••••••"
                    className="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none text-center font-mono text-base"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-lg font-bold text-xs transition-all shadow-lg shadow-blue-600/20"
                >
                  Unlock Portal Workspace
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
          {/* HEADER BAR */}
          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-40 backdrop-blur">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 text-blue-400 rounded-lg font-bold text-lg">🛡️</div>
                <div>
                  <h1 className="text-base font-bold text-slate-100">OKCPS Behavioral Threat Assessment System</h1>
                  <p className="text-[11px] text-slate-400">Browser Auto-Save Active • FERPA & HIPAA Compliant</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button onClick={handleExportData} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700" title="Download backup file">
                  💾 Export Data (.json)
                </button>

                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700">
                  📥 Import Data
                  <input type="file" accept=".json" className="hidden" onChange={handleImportData} />
                </label>

                <button onClick={() => setShowNewIntakeModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-all shadow-md shadow-blue-600/20">
                  + New Threat Intake
                </button>

                <button onClick={handleLogout} className="bg-red-950 hover:bg-red-900 text-red-300 border border-red-800 px-3 py-1.5 rounded-lg text-xs font-bold">
                  Lock Portal
                </button>
              </div>
            </div>
          </header>

          {/* GLOBAL STUDENT LOOKUP TOOLBAR */}
          <div className="bg-slate-900/80 border-b border-slate-800 px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex items-center space-x-3">
              <span className="text-slate-400 text-xs font-semibold uppercase tracking-wider shrink-0">🔍 Student Lookup:</span>
              <div className="relative flex-1">
                <input
                  type="text"
                  placeholder="Type student name or ID# to view all historical cases..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-slate-100 focus:border-blue-500 focus:outline-none"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1.5 text-slate-400 hover:text-white text-xs font-bold">✕</button>
                )}
              </div>
            </div>

            {searchQuery.trim() !== '' && (
              <div className="max-w-7xl mx-auto mt-2 bg-slate-900 border border-blue-500/60 rounded-xl p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span className="text-xs font-bold text-blue-400 uppercase">Student Lookup Results for "{searchQuery}"</span>
                  <button onClick={() => setSearchQuery('')} className="text-xs text-slate-400 hover:text-white">Close Lookup Panel</button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {lookupResults.map(rc => (
                    <div key={rc.id} onClick={() => { selectCaseFromSearch(rc); setSearchQuery(''); }} className="p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-lg cursor-pointer flex justify-between items-start text-xs transition-all">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-slate-100 text-sm">{rc.studentName}</span>
                          <span className="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">ID #{rc.studentId}</span>
                          <span className="text-[10px] font-semibold bg-blue-950 text-blue-300 border border-blue-800 px-2 py-0.5 rounded">{rc.studentGrade || 'Grade N/A'}</span>
                        </div>
                        <p className="text-slate-400 text-[11px]">Campus: {rc.schoolLocation} | TIPS #{rc.tipsReportNum}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* NAVIGATION TABS WITH REAL-TIME CASE COUNTERS */}
          <div className="max-w-7xl mx-auto px-4 pt-4">
            <div className="flex border-b border-slate-800 space-x-6 text-xs font-semibold overflow-x-auto">
              <button onClick={() => { setMainTab('active'); if (activeMediumHighCases.length > 0) setSelectedCaseId(activeMediumHighCases[0].id); }} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'active' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                Active Medium/High Cases ({activeMediumHighCases.length})
              </button>

              <button onClick={() => { setMainTab('planTab'); if (casesOnPlan.length > 0) setSelectedCaseId(casesOnPlan[0].id); }} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'planTab' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                Cases on Support/Safety Plan ({casesOnPlan.length})
              </button>

              <button onClick={() => { setMainTab('low'); if (lowRiskCases.length > 0) setSelectedCaseId(lowRiskCases[0].id); }} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'low' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                Low-Risk Cases ({lowRiskCases.length})
              </button>

              <button onClick={() => { setMainTab('noTriage'); if (openNoTriageCases.length > 0) setSelectedCaseId(openNoTriageCases[0].id); }} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'noTriage' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                Open Cases without Triage ({openNoTriageCases.length})
              </button>

              <button onClick={() => setMainTab('watchTab')} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'watchTab' ? 'border-teal-500 text-teal-300 font-bold' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                👁️ Keeping an Eye On ({watchStudents.length})
              </button>

              <button onClick={() => { setMainTab('closed'); if (closedCases.length > 0) setSelectedCaseId(closedCases[0].id); }} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'closed' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                Closed Cases Archive ({closedCases.length})
              </button>

              <button onClick={() => setMainTab('dashboard')} className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${mainTab === 'dashboard' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                District Oversight Dashboard ({openCasesOnly.length} Open)
              </button>
            </div>
          </div>

          {/* MAIN WORKSPACE */}
          <main className="max-w-7xl mx-auto px-4 py-6">
            {(mainTab === 'active' || mainTab === 'planTab' || mainTab === 'low' || mainTab === 'noTriage' || mainTab === 'closed') && (
              <div className="grid grid-cols-12 gap-6">
                {/* SIDEBAR */}
                <div className="col-span-12 lg:col-span-4 space-y-3">
                  <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    {mainTab === 'active' ? 'Active Medium & High Cases' : mainTab === 'planTab' ? 'Cases Active on Plan' : mainTab === 'low' ? 'Low-Risk Cases' : mainTab === 'noTriage' ? 'Pending Triage' : 'Closed Cases'}
                  </h2>

                  <div className="space-y-2 max-h-[80vh] overflow-y-auto pr-1">
                    {(mainTab === 'active' ? activeMediumHighCases : mainTab === 'planTab' ? casesOnPlan : mainTab === 'low' ? lowRiskCases : mainTab === 'noTriage' ? openNoTriageCases : closedCases).map(c => {
                      const isOnWatch = isStudentOnWatchList(c.studentName, c.studentId);
                      return (
                        <div

                        + Add Incident to {st.studentName}
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="bg-teal-600 text-slate-950 font-bold uppercase text-[11px]">
                            <th className="p-3 border-r border-teal-500/50 w-1/5">Student Name</th>
                            <th className="p-3 border-r border-teal-500/50 w-1/12">Student ID #</th>
                            <th className="p-3 border-r border-teal-500/50 w-1/4">School/Incident Details</th>
                            <th className="p-3 border-r border-teal-500/50 w-1/12">Date</th>
                            <th className="p-3 border-r border-teal-500/50 w-1/12">Triage</th>
                            <th className="p-3 border-r border-teal-500/50 w-1/5">Resolution</th>
                            <th className="p-3 w-1/4">Notes</th>
                          </tr>
                          <tr className="bg-blue-900/90 text-blue-100 font-bold text-xs border-b border-slate-800">
                            <td className="p-3 border-r border-slate-800">{st.studentName}</td>
                            <td className="p-3 border-r border-slate-800 font-mono">{st.studentId}</td>
                            <td className="p-3 border-r border-slate-800">{st.schoolLocation}</td>
                            <td className="p-3 border-r border-slate-800 text-slate-400">--</td>
                            <td className="p-3 border-r border-slate-800 text-slate-400">--</td>
                            <td className="p-3 border-r border-slate-800 text-slate-400">--</td>
                            <td className="p-3 text-amber-300 font-mono">
                              <span onClick={() => handleEditWatchLastUpdated(st.studentId)} className="cursor-pointer hover:bg-amber-950/60 p-1 rounded border border-amber-800/60 inline-flex items-center space-x-1">
                                <span>Last Updated ({st.lastUpdatedDate})</span>
                                <span className="text-[10px] text-amber-400">✏️</span>
                              </span>
                            </td>
                          </tr>
                        </thead>

                        <tbody className="divide-y divide-slate-800">
                          {st.incidents.map((inc) => (
                            <tr key={inc.id} className="hover:bg-slate-800/40 align-top">
                              <td className="p-3 font-semibold text-slate-300 bg-slate-950/60 border-r border-slate-800">TIPS involved in</td>
                              <td className="p-3 font-mono font-bold text-blue-400 bg-slate-950/40 border-r border-slate-800">TIPS #{inc.tipsNum}</td>
                              <td className="p-3 text-slate-200 border-r border-slate-800">{inc.details}</td>
                              <td className="p-3 font-mono text-slate-300 border-r border-slate-800 whitespace-nowrap">{inc.date}</td>
                              <td className="p-3 border-r border-slate-800">{inc.triage}</td>
                              <td className="p-3 text-slate-300 border-r border-slate-800">{inc.resolution}</td>
                              <td className="p-3 text-slate-300">{inc.notes}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* DISTRICT OVERSIGHT DASHBOARD MATRIX */}
            {mainTab === 'dashboard' && (
              <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <div>
                    <h2 className="text-base font-bold text-slate-100">District-Wide Open Cases Matrix</h2>
                    <p className="text-xs text-slate-400 mt-0.5">Tracking active/monitored open cases across all campuses. Closed cases are housed in the Closed Cases Archive tab.</p>
                  </div>
                  <span className="text-xs font-bold bg-blue-950 text-blue-300 border border-blue-700 px-3 py-1.5 rounded-lg">
                    {openCasesOnly.length} Active Open Cases
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-300">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase text-[10px]">
                      <tr>
                        <th className="p-3">Student / ID</th>
                        <th className="p-3">Grade</th>
                        <th className="p-3">School Location</th>
                        <th className="p-3">Victim Info</th>
                        <th className="p-3">Incident Date</th>
                        <th className="p-3">Involved Students</th>
                        <th className="p-3">TIPS #</th>
                        <th className="p-3">Triage Status</th>
                        <th className="p-3">CSTAG Classification</th>
                        <th className="p-3">Plan Status</th>
                        <th className="p-3">Case Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {openCasesOnly.map(c => (
                        <tr key={c.id} className="hover:bg-slate-800/40">
                          <td className="p-3 font-semibold text-slate-100">{c.studentName} <span className="text-slate-500 font-mono text-[10px]">#{c.studentId}</span></td>
                          <td className="p-3 font-medium text-blue-300">{c.studentGrade || 'N/A'}</td>
                          <td className="p-3">{c.schoolLocation}</td>
                          <td className="p-3 text-rose-300 font-medium">{c.victimName || 'None'}</td>
                          <td className="p-3 font-mono text-slate-300">{c.incidentDate || 'N/A'}</td>
                          <td className="p-3 text-amber-300/90">{c.involvedStudents || 'None'}</td>
                          <td className="p-3 font-mono">{c.tipsReportNum}</td>
                          <td className="p-3">{c.triagePriority}</td>
                          <td className="p-3 font-bold">{c.cstagClassification || 'Pending'}</td>
                          <td className="p-3"><span className={`px-2 py-0.5 text-[10px] font-bold rounded border ${getPlanStatusStyle(c.planStatus)}`}>{c.planStatus || 'Not Completed'}</span></td>
                          <td className="p-3"><span className="font-semibold text-blue-400">{c.caseStatus}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ADVANCED DOCUMENT VIEWER MODAL */}
          {viewingDoc && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-2 sm:p-4">
              <div className={`bg-slate-900 border border-slate-800 rounded-xl flex flex-col shadow-2xl overflow-hidden ${isFullscreen ? 'w-full h-full rounded-none' : 'max-w-5xl w-full h-[88vh]'}`}>
                <div className="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
                  <span className="font-bold text-xs text-slate-100 truncate">{viewingDoc.name}</span>
                  <div className="flex items-center space-x-2">
                    <button onClick={() => setIsFullscreen(!isFullscreen)} className="bg-slate-800 text-slate-200 text-xs px-2.5 py-1 rounded">Fullscreen ⛶</button>
                    <a href={viewingDoc.url} download={viewingDoc.name} className="bg-blue-600 text-white text-xs px-3 py-1 rounded font-semibold">Download</a>
                    <button onClick={() => setViewingDoc(null)} className="text-slate-400 hover:text-white font-bold text-lg px-2">✕</button>
                  </div>
                </div>
                <div className="flex-1 bg-slate-950 p-4 overflow-auto flex items-center justify-center">
                  <iframe src={viewingDoc.url} className="w-full h-full rounded border border-slate-800" title={viewingDoc.name} />
                </div>
              </div>
            </div>
          )}

          {/* ADD STUDENT TO WATCH LIST MODAL */}
          {showAddWatchModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-teal-300">Add Student to "Keeping an Eye On" Log</h3>
                  <button onClick={() => setShowAddWatchModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddWatchStudent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Student Name</label>
                      <input type="text" required value={watchName} onChange={(e) => setWatchName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #</label>
                      <input type="text" required value={watchId} onChange={(e) => setWatchId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">School / Location</label>
                      <input type="text" required value={watchSchool} onChange={(e) => setWatchSchool(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Initial TIPS Report #</label>
                      <input type="text" required value={watchTipsNum} onChange={(e) => setWatchTipsNum(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Incident Details</label>
                    <textarea rows="2" value={watchDetails} onChange={(e) => setWatchDetails(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddWatchModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300">Cancel</button>
                    <button type="submit" className="bg-teal-600 text-white px-5 py-2 rounded font-semibold">Save Watch Student</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* NEW INTAKE MODAL */}
          {showNewIntakeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-slate-100">New Threat Intake (Upload TIPS & Triage PDF)</h3>
                  <button onClick={() => setShowNewIntakeModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateCase} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <span className="text-2xl block mb-1">📄</span>
                      <p className="font-semibold text-slate-200 mb-1">Upload TIPS Report PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTipsFileUpload} className="text-xs text-slate-400 w-full" />
                      {isParsingPdf && <p className="mt-2 text-yellow-400 text-[10px] animate-pulse">Reading TIPS PDF text streams...</p>}
                    </div>

                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <span className="text-2xl block mb-1">📋</span>
                      <p className="font-semibold text-slate-200 mb-1">Upload Threat Triage PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTriageFileUpload} className="text-xs text-slate-400 w-full" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="text-slate-400 block mb-1">Primary Student Name</label>
                      <input type="text" required value={intakeStudentName} onChange={(e) => setIntakeStudentName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #</label>
                      <input type="text" required value={intakeStudentId} onChange={(e) => setIntakeStudentId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Student Grade</label>
                      <select value={intakeStudentGrade} onChange={(e) => setIntakeStudentGrade(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100 font-semibold">
                        <option value="Pre-K / Kindergarten">Pre-K / Kindergarten</option>
                        <option value="1st Grade">1st Grade</option>
                        <option value="2nd Grade">2nd Grade</option>
                        <option value="3rd Grade">3rd Grade</option>
                        <option value="4th Grade">4th Grade</option>
                        <option value="5th Grade">5th Grade</option>
                        <option value="6th Grade">6th Grade</option>
                        <option value="7th Grade">7th Grade</option>
                        <option value="8th Grade">8th Grade</option>
                        <option value="9th Grade">9th Grade</option>
                        <option value="10th Grade">10th Grade</option>
                        <option value="11th Grade">11th Grade</option>
                        <option value="12th Grade">12th Grade</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">School Location / Campus</label>
                      <input type="text" required value={intakeSchool} onChange={(e) => setIntakeSchool(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">TIPS Report Number</label>
                      <input type="text" required value={intakeTipsNum} onChange={(e) => setIntakeTipsNum(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  {/* RESTORED & PROPERLY BOUND VICTIM MODULE */}
                  <div className="bg-slate-950 p-3.5 rounded-lg border border-rose-900/60 space-y-3">
                    <span className="text-[11px] font-bold text-rose-300 uppercase tracking-wide flex items-center space-x-1.5">
                      <span>🎯</span>
                      <span>Targeted Victim Information</span>
                    </span>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="text-slate-400 block mb-1">Victim Name</label>
                        <input 
                          type="text" 
                          placeholder="e.g., Jane Doe" 
                          value={intakeVictimName} 
                          onChange={(e) => setIntakeVictimName(e.target.value)} 
                          className="w-full bg-slate-900 border border-slate-800 p-2 rounded text-slate-100 focus:border-rose-500" 
                        />
                      </div>

                      <div>
                        <label className="text-slate-400 block mb-1">Victim Role / Type</label>
                        <select 
                          value={intakeVictimRole} 
                          onChange={(e) => setIntakeVictimRole(e.target.value)} 
                          className="w-full bg-slate-900 border border-slate-800 p-2 rounded text-slate-100 focus:border-rose-500"
                        >
                          <option value="Student">Student</option>
                          <option value="Staff Member">Staff Member</option>
                          <option value="Other">Other (Specify below)</option>
                        </select>
                      </div>
                    </div>

                    {intakeVictimRole === 'Other' && (
                      <div className="pt-1">
                        <label className="text-rose-300 block mb-1 font-semibold">Specify Role / Relationship (Fill-In):</label>
                        <input 
                          type="text" 
                          placeholder="e.g., Parent, Campus Visitor, Security Guard, Community Member..." 
                          value={intakeVictimOtherRoleDetails} 
                          onChange={(e) => setIntakeVictimOtherRoleDetails(e.target.value)} 
                          className="w-full bg-slate-900 border border-rose-800 p-2 rounded text-slate-100 focus:border-rose-500 font-medium" 
                        />
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">TIPS Incident Date</label>
                      <input type="date" required value={intakeIncidentDate} onChange={(e) => setIntakeIncidentDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1">Other Involved / Associated Students & ID #s</label>
                      <input 
                        type="text" 
                        placeholder="e.g., Raymond Vance (ID: 332901), Sarah Lopez (ID: 441029)" 
                        value={intakeInvolvedStudents} 
                        onChange={(e) => setIntakeInvolvedStudents(e.target.value)} 
                        className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Generated Threat Brief (Editable)</label>
                    <textarea rows="2" required value={intakeBrief} onChange={(e) => setIntakeBrief(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <div className="flex items-center space-x-2">
                      <input type="checkbox" id="iepCheck" checked={intakeIsIep} onChange={(e) => setIntakeIsIep(e.target.checked)} className="rounded bg-slate-950 border-slate-800 text-blue-600" />
                      <label htmlFor="iepCheck" className="text-slate-300 font-semibold">Student on IEP (OESS Flag)</label>
                    </div>

                    <div className="flex items-center space-x-2">
                      <input type="checkbox" id="suspensionCheck" checked={intakeSuspended} onChange={(e) => setIntakeSuspended(e.target.checked)} className="rounded bg-slate-950 border-slate-800 text-blue-600" />
                      <label htmlFor="suspensionCheck" className="text-slate-300">OSS Suspension Active?</label>
                    </div>
                  </div>

                  {intakeSuspended && (
                    <div>
                      <label className="text-slate-400 block mb-1">OSS Re-entry Date</label>
                      <input type="date" value={intakeReEntryDate} onChange={(e) => setIntakeReEntryDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  )}

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowNewIntakeModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white px-5 py-2 rounded font-semibold">Initialize or Merge Case</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CLOSE CASE MODAL */}
          {showCloseCaseModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-100">Close Case & Archive</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Close Date</label>
                    <input type="date" required value={closeCaseDate} onChange={(e) => setCloseCaseDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Resolution Notes</label>
                    <textarea rows="3" required value={closeCaseNotes} onChange={(e) => setCloseCaseNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-100" />
                  </div>
                </div>
                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                  <button onClick={() => setShowCloseCaseModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded">Cancel</button>
                  <button onClick={handleConfirmCloseCase} className="bg-red-600 text-white px-4 py-2 rounded font-semibold">Confirm & Archive</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
