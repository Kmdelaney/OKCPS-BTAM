    function App() {
      // SECURITY STATE

      const [watchId, setWatchId] = useState('');
      const [watchSchool, setWatchSchool] = useState('');
      const [watchTipsNum, setWatchTipsNum] = useState('');
      const [watchDetails, setWatchDetails] = useState('');

      const [intakeSchool, setIntakeSchool] = useState('');
      const [intakeVictimName, setIntakeVictimName] = useState('');
      const [intakeVictimRole, setIntakeVictimRole] = useState('Student');

      useEffect(() => { localStorage.setItem('okcps_watch_list', JSON.stringify(watchStudents)); }, [watchStudents]);

      // AUTHENTICATION
      const handleAuthenticate = (e) => {
        e.preventDefault();
        if (inputPasscode === SYSTEM_PASSCODE) {
          setIsAuthenticated(true);
          sessionStorage.setItem('okcps_auth_token', 'true');

      const handleLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('okcps_auth_token');
      };

      // EXPORT & IMPORT
      const handleExportData = () => {
        const backupData = { cases, watchStudents, exportDate: new Date().toISOString() };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `OKCPS_Threat_Backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (imported.cases && Array.isArray(imported.cases)) {
              setCases(imported.cases);
              if (imported.watchStudents) setWatchStudents(imported.watchStudents);
              alert("System Data Restored Successfully!");
            }
          } catch (err) { alert("Error reading file: " + err.message); }
        };
        reader.readAsText(file);
      };

      // GLOBAL DELETES
      const handleDeleteCaseOverall = (caseIdToDelete) => {
        const targetCase = cases.find(c => c.id === caseIdToDelete);
        if (window.confirm(`⚠️ Are you sure you want to PERMANENTLY delete the entire case for ${targetCase?.studentName || caseIdToDelete}?`)) {
          const updatedCases = cases.filter(c => c.id !== caseIdToDelete);
          setCases(updatedCases);
          if (selectedCaseId === caseIdToDelete) {
            setSelectedCaseId(updatedCases[0]?.id || null);

      const handleDeleteWatchStudent = (studentId) => {
        if (window.confirm(`Remove student from Watch List?`)) {
          setWatchStudents(watchStudents.filter(st => st.studentId !== studentId));
        }
      };

      const handleDeleteWatchIncident = (studentId, incId) => {
        if (window.confirm("Delete incident log entry?")) {
          setWatchStudents(watchStudents.map(st => st.studentId === studentId ? { ...st, incidents: st.incidents.filter(inc => inc.id !== incId) } : st));

      };

      // POST-INTAKE TRIAGE HANDLER
      const handleOpenTriageModal = (c) => {
        setTriageCaseTarget(c);
        setSelectedTriageScore('High');
        setShowTriageModal(true);
      };

      const handleSavePostIntakeTriage = (e) => {
        e.preventDefault();
        if (!triageCaseTarget) return;

        const isLow = selectedTriageScore === 'Low';
        const newClassification = isLow ? 'Not-a-Threat' : 'Serious Substantive Threat';

        setCases(cases.map(c => {
          if (c.id === triageCaseTarget.id) {
            return {
              ...c,
              triagePriority: selectedTriageScore,
              triageCompleted: true,
              cstagClassification: newClassification,
              pathwayEvents: (!isLow && (!c.pathwayEvents || c.pathwayEvents.length === 0))
                ? [{ id: Date.now(), stage: 'Grievance', description: `Post-intake triage completed: Assigned ${selectedTriageScore} priority`, date: new Date().toISOString().split('T')[0], moveNote: '' }]
                : (c.pathwayEvents || [])
            };
          }
          return c;
        }));

        setShowTriageModal(false);
        setTriageCaseTarget(null);
        if (isLow) setMainTab('low');
        else setMainTab('active');
      };

      // FILTERED CATEGORIES
      const activeMediumHighCases = cases.filter(c => c.triageCompleted && (c.triagePriority === 'Medium' || c.triagePriority === 'High') && c.caseStatus !== 'Closed');
      const casesOnPlan = cases.filter(c => c.caseStatus !== 'Closed' && ((c.cstagClassification && c.cstagClassification !== 'Not-a-Threat' && c.cstagClassification !== 'Pending Assessment') || (c.planStartDate && c.planStartDate.trim() !== '') || c.planDoc !== null));
      const lowRiskCases = cases.filter(c => c.triageCompleted && c.triagePriority === 'Low' && c.caseStatus !== 'Closed');
      const openNoTriageCases = cases.filter(c => !c.triageCompleted && c.caseStatus !== 'Closed');
      const closedCases = cases.filter(c => c.caseStatus === 'Closed');
      const openCasesOnly = cases.filter(c => c.caseStatus !== 'Closed');

      const currentCase = cases.find(c => c.id === selectedCaseId) || activeMediumHighCases[0] || cases[0];

      const isStudentOnWatchList = (name, id) => {
        if (!name && !id) return false;
        return watchStudents.some(w => (id && w.studentId === id) || (name && w.studentName.toLowerCase() === name.toLowerCase()));
      };

      useEffect(() => {
        if (currentCase) setTempStatusNotes(currentCase.caseTeamStatusNotes || '');
      }, [selectedCaseId, currentCase?.id]);

      const handleSaveStatusNotes = () => {
        if (!currentCase) return;
        const today = new Date().toISOString().split('T')[0];
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, caseTeamStatusNotes: tempStatusNotes, caseTeamStatusLastUpdated: today } : c));

      const handleEditWatchLastUpdated = (studentId) => {
        const currentStudent = watchStudents.find(st => st.studentId === studentId);
        if (!currentStudent) return;
        const newDate = prompt("Enter new Last Updated date:", currentStudent.lastUpdatedDate);
        if (newDate && newDate.trim() !== '') {
          setWatchStudents(watchStudents.map(st => st.studentId === studentId ? { ...st, lastUpdatedDate: newDate.trim() } : st));
        }
      };

      const handleDeleteDocument = (category, docId) => {
        if (!currentCase) return;
        if (!window.confirm("Delete document from vault?")) return;
        setCases(cases.map(c => {
          if (c.id === currentCase.id) {
            const currentCatDocs = c.documents?.[category] || [];
            return { ...c, documents: { ...c.documents, [category]: currentCatDocs.filter(d => d.id !== docId && d.name !== docId) } };
          }
          return c;
        }));
      };

      const lookupResults = searchQuery.trim() === '' ? [] : cases.filter(c => {
        const q = searchQuery.toLowerCase();
        return c.studentName.toLowerCase().includes(q) || c.studentId.toLowerCase().includes(q) || (c.involvedStudents && c.involvedStudents.toLowerCase().includes(q));
      });

      const handleTipsFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileUrl = URL.createObjectURL(file);
        setUploadedTipsFile({ file, url: fileUrl, name: file.name });
        setIsParsingPdf(true);

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const textContent = await page.getTextContent();
            fullText += textContent.items.map(item => item.str).join(' ') + ' ';
          }

          const nameMatch = fullText.match(/(?:Student Name|Subject|Student|Name):\s*([A-Za-z\s-]+?)(?=\s+(?:ID|Grade|School|TIPS|Date|$))/i);
          const idMatch = fullText.match(/(?:Student ID|ID #|ID):\s*(\d{5,8})/i);
          const schoolMatch = fullText.match(/(?:School|Campus|Location):\s*([A-Za-z0-9\s.-]+?)(?=\s+(?:TIPS|Report|ID|$))/i);
          const tipsMatch = fullText.match(/(?:TIPS Report #|TIPS #):\s*(26-\d{4,5}|\d{5,7})/i);

          if (nameMatch) setIntakeStudentName(nameMatch[1].trim());
          if (idMatch) setIntakeStudentId(idMatch[1].trim());
          if (schoolMatch) setIntakeSchool(schoolMatch[1].trim());
          if (tipsMatch) setIntakeTipsNum(tipsMatch[1].trim());
        } catch (err) {
          console.warn('PDF parser fallback active');
        } finally {
          setIsParsingPdf(false);
        }
      };

      const handleTriageFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileUrl = URL.createObjectURL(file);
        setUploadedTriageFile({ file, url: fileUrl, name: file.name });
        const fname = file.name.toUpperCase();
        if (fname.includes('HIGH')) setDetectedTriageScore('High');
        else if (fname.includes('MED')) setDetectedTriageScore('Medium');
        else if (fname.includes('LOW')) setDetectedTriageScore('Low');
        else setDetectedTriageScore('High');
      };

      const handleFileUpload = (category, e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = {
          id: `doc-${Date.now()}`,
          name: file.name,
          uploadDate: new Date().toISOString().split('T')[0],
          size: `${(file.size / 1024).toFixed(0)} KB`,
          url: fileUrl,
          isImage: file.type.startsWith('image/')
        };

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, documents: { ...c.documents, [category]: [...(c.documents[category] || []), newDoc] } } : c));
      };

      const handleAddWatchStudent = (e) => {
        e.preventDefault();
        const newStudent = {
          studentName: watchName.trim(),
          studentId: watchId.trim(),
          schoolLocation: watchSchool.trim(),
          lastUpdatedDate: new Date().toLocaleDateString('en-US'),
          incidents: [{
            id: `inc-${Date.now()}`,
            tipsNum: watchTipsNum.trim() || 'Pending',
            details: watchDetails.trim() || 'No initial details logged.',
            date: watchDate,
            triage: watchTriage,
            resolution: watchResolution.trim() || 'Pending action',
            notes: watchNotes.trim() || 'No notes.',
            tipsDoc: null,
            recordsDocs: []
          }]
        };
        setWatchStudents([newStudent, ...watchStudents]);
        setShowAddWatchModal(false);
        setWatchName(''); setWatchId(''); setWatchSchool(''); setWatchTipsNum(''); setWatchDetails('');
      };

      const handleSaveWatchIncident = (shouldAddAnother = false) => {
        if (!targetWatchStudentId) return;
        const newIncident = {
          id: `inc-${Date.now()}`,
          tipsNum: watchIncTipsNum.trim() || 'Pending',
          details: watchIncDetails.trim() || 'No details provided',
          date: watchIncDate || new Date().toLocaleDateString('en-US'),
          triage: watchIncTriage,
          resolution: watchIncResolution.trim() || 'Pending',
          notes: watchIncNotes.trim() || 'None',
          tipsDoc: null,
          recordsDocs: []
        };

        setWatchStudents(watchStudents.map(st => st.studentId === targetWatchStudentId ? { ...st, lastUpdatedDate: new Date().toLocaleDateString('en-US'), incidents: [...st.incidents, newIncident] } : st));

        if (shouldAddAnother) {
          setWatchIncTipsNum(''); setWatchIncDetails(''); setWatchIncResolution(''); setWatchIncNotes('');
        } else {
          setShowAddWatchIncidentModal(false);
          setTargetWatchStudentId(null);
        }
      };

      const handleStartEditWatchInc = (studentId, inc) => {
        setEditingWatchIncKey(`${studentId}_${inc.id}`);
        setEditWatchIncData({ ...inc });
      };

      const handleSaveInlineWatchInc = (studentId, incId) => {
        setWatchStudents(watchStudents.map(st => st.studentId === studentId ? { ...st, lastUpdatedDate: new Date().toLocaleDateString('en-US'), incidents: st.incidents.map(inc => inc.id === incId ? { ...inc, ...editWatchIncData } : inc) } : st));
        setEditingWatchIncKey(null);
      };

      const handleCstagDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagDoc: newDoc } : c));
      };

      const handlePlanDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, planDoc: newDoc } : c));
      };

      const handleCstagChange = (classification) => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagClassification: classification } : c));
      };

      const toggleImmediateCheck = (field) => {
        if (!currentCase) return;
        const currentChecks = currentCase.immediateResponse || { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, immediateResponse: { ...currentChecks, [field]: !currentChecks[field] } } : c));
      };

      const updatePlanDetail = (field, val) => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, [field]: val } : c));
      };

      const handleAddPathwayEvent = (e) => {
        e.preventDefault();
        if (!newEventDesc.trim() || !currentCase) return;
        const newEvent = { id: Date.now(), stage: newEventStage, description: newEventDesc.trim(), date: newEventDate, moveNote: '' };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: [...(c.pathwayEvents || []), newEvent] } : c));
        setShowAddPathwayModal(false);
        setNewEventDesc('');
      };

      const handleDeletePathwayEvent = (evtId) => {
        if (!currentCase || !window.confirm("Delete this pathway event?")) return;
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: (c.pathwayEvents || []).filter(e => e.id !== evtId) } : c));
      };

      const handleSaveMovedPathwayEvent = (e) => {
        e.preventDefault();
        if (!editingPathwayEvent || !currentCase) return;
        const updatedEvents = (currentCase.pathwayEvents || []).map(evt => {
          if (evt.id === editingPathwayEvent.id) {
            return {
              ...evt,
              stage: moveTargetStage,
              moveNote: moveReasonNote.trim() ? `Moved to ${moveTargetStage}: "${moveReasonNote.trim()}"` : evt.moveNote

          return evt;

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: updatedEvents } : c));
        setEditingPathwayEvent(null);
      };

      const handleCreateCase = (e) => {
        e.preventDefault();
        const isTriageProvided = !!uploadedTriageFile;
        const finalPriority = isTriageProvided ? detectedTriageScore : 'Pending Triage';

        const newCase = {
          id: intakeTipsNum || `26-${Math.floor(1000 + Math.random() * 9000)}`,
          studentName: intakeStudentName || 'New Student',
          studentId: intakeStudentId || '000000',
          studentGrade: intakeStudentGrade || '9th Grade',

          involvedStudents: intakeInvolvedStudents.trim() !== '' ? intakeInvolvedStudents.trim() : 'None Listed',

          immediateResponse: { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false },
          planStatus: 'Waiting on team to schedule',

          documents: { studentInterview: [], parentInterview: [], witnessStatements: [], recordsReview: [] },
          pathwayEvents: (isTriageProvided && finalPriority !== 'Low') ? [{ id: Date.now(), stage: 'Grievance', description: `Initial threat logged via TIPS #${intakeTipsNum}`, date: intakeIncidentDate || new Date().toISOString().split('T')[0], moveNote: '' }] : []

        setShowNewIntakeModal(false);

        else if (finalPriority === 'Low') setMainTab('low');

                <p className="text-xs text-slate-400">System Security Lockout Active</p>
              </div>

              {passcodeError && <div className="bg-red-950/80 border border-red-800 text-red-200 p-3 rounded-lg text-xs font-semibold text-center">Incorrect Passcode.</div>}

              <form onSubmit={handleAuthenticate} className="space-y-4 text-xs">
                <div>
                  <label className="text-slate-400 block mb-1.5 font-semibold">Enter General System Passcode</label>
                  <input type="password" required value={inputPasscode} onChange={(e) => setInputPasscode(e.target.value)} placeholder="••••••••••••" className="w-full bg-slate-950 border border-slate-800 p-3 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none text-center font-mono text-base" />
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-lg font-bold text-xs shadow-lg">Unlock Portal Workspace</button>
              </form>
            </div>
          </div>
        );

      return (

          {/* HEADER BAR */}
          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-40 backdrop-blur">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 text-blue-400 rounded-lg font-bold text-lg">🛡️</div>
                <div>
                  <h1 className="text-base font-bold text-slate-100">OKCPS Behavioral Threat Assessment System</h1>
                  <p className="text-[11px] text-slate-400">Browser Auto-Save Active • FERPA & HIPAA Compliant</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button onClick={handleExportData} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700">💾 Export Data</button>
                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700">
                  📥 Import Data <input type="file" accept=".json" className="hidden" onChange={handleImportData} />
                </label>
                <button onClick={() => setShowNewIntakeModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow">+ New Threat Intake</button>
                <button onClick={handleLogout} className="bg-red-950 hover:bg-red-900 text-red-300 border border-red-800 px-3 py-1.5 rounded-lg text-xs font-bold">Lock Portal</button>
              </div>
            </div>
          </header>

          {/* SEARCH TOOLBAR */}
          <div className="bg-slate-900/80 border-b border-slate-800 px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex items-center space-x-3">
              <span className="text-slate-400 text-xs font-semibold uppercase shrink-0">🔍 Student Lookup:</span>
              <div className="relative flex-1">
                <input type="text" placeholder="Type student name or ID# to search across all records..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg text-xs text-slate-100 focus:border-blue-500 focus:outline-none" />
                {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1.5 text-slate-400 hover:text-white text-xs font-bold">✕</button>}
              </div>
            </div>

            {searchQuery.trim() !== '' && (
              <div className="max-w-7xl mx-auto mt-2 bg-slate-900 border border-blue-500/60 rounded-xl p-4 space-y-2 shadow-2xl">
                {lookupResults.map(rc => (
                  <div key={rc.id} onClick={() => { selectCaseFromSearch(rc); setSearchQuery(''); }} className="p-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-lg cursor-pointer flex justify-between items-center text-xs">
                    <div>
                      <span className="font-bold text-slate-100">{rc.studentName}</span> <span className="text-slate-400 font-mono">(ID #{rc.studentId})</span>
                      <p className="text-slate-400 text-[11px]">{rc.schoolLocation} • TIPS #{rc.tipsReportNum}</p>
                    </div>
                    <span className="text-blue-400 font-bold">{rc.caseStatus}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* NAVIGATION TABS */}
          <div className="max-w-7xl mx-auto px-4 pt-4">
            <div className="flex border-b border-slate-800 space-x-6 text-xs font-semibold overflow-x-auto">
              <button onClick={() => { setMainTab('active'); if (activeMediumHighCases.length > 0) setSelectedCaseId(activeMediumHighCases[0].id); }} className={`pb-3 border-b-2 ${mainTab === 'active' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}>
                Active Medium/High Cases ({activeMediumHighCases.length})
              </button>
              <button onClick={() => { setMainTab('planTab'); if (casesOnPlan.length > 0) setSelectedCaseId(casesOnPlan[0].id); }} className={`pb-3 border-b-2 ${mainTab === 'planTab' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}>
                Cases on Support/Safety Plan ({casesOnPlan.length})
              </button>
              <button onClick={() => { setMainTab('low'); if (lowRiskCases.length > 0) setSelectedCaseId(lowRiskCases[0].id); }} className={`pb-3 border-b-2 ${mainTab === 'low' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}>

              <button onClick={() => { setMainTab('noTriage'); if (openNoTriageCases.length > 0) setSelectedCaseId(openNoTriageCases[0].id); }} className={`pb-3 border-b-2 ${mainTab === 'noTriage' ? 'border-purple-500 text-purple-400 font-bold' : 'border-transparent text-slate-400'}`}>
                Open Cases without Triage ({openNoTriageCases.length})
              </button>
              <button onClick={() => setMainTab('watchTab')} className={`pb-3 border-b-2 ${mainTab === 'watchTab' ? 'border-teal-500 text-teal-300 font-bold' : 'border-transparent text-slate-400'}`}>

              </button>
              <button onClick={() => { setMainTab('closed'); if (closedCases.length > 0) setSelectedCaseId(closedCases[0].id); }} className={`pb-3 border-b-2 ${mainTab === 'closed' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}>

            </div>
          </div>

          {/* MAIN WORKSPACE */}
          <main className="max-w-7xl mx-auto px-4 py-6">

              <div className="grid grid-cols-12 gap-6">
                {/* SIDEBAR */}
                <div className="col-span-12 lg:col-span-4 space-y-3">
                  <div className="space-y-2 max-h-[80vh] overflow-y-auto pr-1">
                    {(mainTab === 'active' ? activeMediumHighCases : mainTab === 'planTab' ? casesOnPlan : mainTab === 'low' ? lowRiskCases : mainTab === 'noTriage' ? openNoTriageCases : closedCases).map(c => (
                      <div key={c.id} onClick={() => setSelectedCaseId(c.id)} className={`p-3.5 rounded-xl border cursor-pointer transition-all ${selectedCaseId === c.id ? 'bg-slate-900 border-blue-500 shadow-lg' : 'bg-slate-900/40 border-slate-800'}`}>
                        <div className="flex justify-between items-start mb-1">
                          <span className="font-bold text-sm text-slate-100">{c.studentName}</span>
                          <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${c.triagePriority === 'High' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-slate-800 text-slate-300'}`}>
                            {c.triagePriority}
                          </span>
                        </div>
                        <div className="text-xs text-slate-400 mb-2 flex justify-between">
                          <span>ID: #{c.studentId} • <strong className="text-blue-300">{c.studentGrade || 'N/A'}</strong></span>

                        </div>
                        <p className="text-xs text-slate-300 line-clamp-2 bg-slate-950 p-2 rounded border border-slate-800/80 mb-2">"{c.tovBrief}"</p>
                        
                        {!c.triageCompleted && (
                          <button onClick={(e) => { e.stopPropagation(); handleOpenTriageModal(c); }} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs py-1.5 px-3 rounded shadow transition-all">

                    ))}

                <div className="col-span-12 lg:col-span-8 space-y-6">
                  {currentCase ? (

                      {/* HEADER CARD */}

                            <div className="flex items-center space-x-3">
                              <h2 className="text-xl font-bold text-slate-100">{currentCase.studentName}</h2>
                              <span className="text-xs font-mono bg-slate-800 text-slate-300 px-2.5 py-1 rounded">#{currentCase.studentId}</span>
                              <span className="text-xs font-semibold bg-blue-950 text-blue-300 border border-blue-700 px-2.5 py-1 rounded">{currentCase.studentGrade || 'Grade N/A'}</span>

                          <div className="flex items-center space-x-2">
                            {!currentCase.triageCompleted && (

                              </button>

                            {currentCase.caseStatus !== 'Closed' && (
                              <button onClick={() => setShowCloseCaseModal(true)} className="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1 rounded font-semibold">
                                Archive Case
                              </button>
                            )}
                            <button onClick={() => handleDeleteCaseOverall(currentCase.id)} className="bg-red-950 hover:bg-red-900 border border-red-700 text-red-300 text-xs px-3 py-1 rounded font-bold">
                              🗑️ Delete Case
                            </button>
                          </div>
                        </div>

                        {/* VICTIM & INVOLVED BADGES */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                          <div className="bg-slate-950 p-3 rounded-lg border border-slate-800/80 flex items-center justify-between">
                            <span className="font-semibold text-slate-400 uppercase text-[10px]">🎯 Targeted Victim:</span>
                            <span className="font-medium text-rose-200 bg-rose-950/60 border border-rose-800/80 px-2.5 py-1 rounded">
                              {currentCase.victimName || 'None Listed'} ({currentCase.victimRole || 'Student'})

                            <span className="font-medium text-amber-200 bg-amber-950/60 border border-amber-800/80 px-2.5 py-1 rounded">
                              {currentCase.involvedStudents || 'None Listed'}
                            </span>

                        </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                            <div className="flex items-center justify-between p-2.5 bg-slate-900 border border-slate-800 rounded">
                              <span className="font-semibold text-slate-200 truncate">{currentCase.intakeFiles?.tipsPdf?.name || 'TIPS_Report.pdf'}</span>
                              <button onClick={() => openDocViewer(currentCase.intakeFiles?.tipsPdf)} className="bg-blue-900/60 text-blue-200 text-[11px] px-2.5 py-1 rounded">View</button>
                            </div>

                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-blue-300">Add Event to Pathway to Violence</h3>
                  <button onClick={() => setShowAddPathwayModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddPathwayEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Select Stage</label>
                    <select value={newEventStage} onChange={(e) => setNewEventStage(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100 font-semibold">
                      {PATHWAY_STAGES.map(s => (<option key={s.key} value={s.key}>{s.label}</option>))}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Event Date</label>
                    <input type="date" required value={newEventDate} onChange={(e) => setNewEventDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Event Description</label>
                    <textarea rows="3" required placeholder="e.g., Posted photo with weapon on social media..." value={newEventDesc} onChange={(e) => setNewEventDesc(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-100" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddPathwayModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded">Cancel</button>
                    <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded font-semibold">Save Event</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MOVE PATHWAY EVENT MODAL */}
          {editingPathwayEvent && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-slate-100">Move Event to Different Stage</h3>
                  <button onClick={() => setEditingPathwayEvent(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveMovedPathwayEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Target Stage</label>
                    <select value={moveTargetStage} onChange={(e) => setMoveTargetStage(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100 font-bold">
                      {PATHWAY_STAGES.map(s => (<option key={s.key} value={s.key}>{s.label}</option>))}
                    </select>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setEditingPathwayEvent(null)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Move Stage</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD WATCH INCIDENT MODAL */}
          {showAddWatchIncidentModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-teal-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-teal-300">Add Incident Entry to Log</h3>
                  <button onClick={() => setShowAddWatchIncidentModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">TIPS Report #</label>
                    <input type="text" value={watchIncTipsNum} onChange={(e) => setWatchIncTipsNum(e.target.value)} placeholder="e.g. 26-03099" className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100 font-mono" />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Incident Details</label>
                    <textarea rows="2" value={watchIncDetails} onChange={(e) => setWatchIncDetails(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div className="flex justify-between items-center pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddWatchIncidentModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded">Cancel</button>
                    <div className="flex space-x-2">
                      <button type="button" onClick={() => handleSaveWatchIncident(true)} className="bg-teal-900 border border-teal-600 text-teal-200 px-4 py-2 rounded font-semibold">Save & Add Another (Next ➔)</button>
                      <button type="button" onClick={() => handleSaveWatchIncident(false)} className="bg-teal-600 text-white px-5 py-2 rounded font-semibold">Save & Finish</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ADD WATCH STUDENT MODAL */}
          {showAddWatchModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-xl w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-teal-300">Add Student to Watch List</h3>
                  <button onClick={() => setShowAddWatchModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddWatchStudent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Student Name</label>
                      <input type="text" required value={watchName} onChange={(e) => setWatchName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #</label>
                      <input type="text" required value={watchId} onChange={(e) => setWatchId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">School Location</label>
                      <input type="text" required value={watchSchool} onChange={(e) => setWatchSchool(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">TIPS Report #</label>
                      <input type="text" required value={watchTipsNum} onChange={(e) => setWatchTipsNum(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Incident Details</label>
                    <textarea rows="2" value={watchDetails} onChange={(e) => setWatchDetails(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddWatchModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300">Cancel</button>
                    <button type="submit" className="bg-teal-600 text-white px-5 py-2 rounded font-semibold">Save Watch Student</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* NEW INTAKE MODAL */}
          {showNewIntakeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-slate-100">New Threat Intake</h3>
                  <button onClick={() => setShowNewIntakeModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleCreateCase} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <p className="font-semibold text-slate-200 mb-1">Upload TIPS Report PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTipsFileUpload} className="text-xs text-slate-400 w-full" />
                    </div>
                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <p className="font-semibold text-slate-200 mb-1">Upload Threat Triage PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTriageFileUpload} className="text-xs text-slate-400 w-full" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div className="col-span-2">
                      <label className="text-slate-400 block mb-1">Student Name</label>
                      <input type="text" required value={intakeStudentName} onChange={(e) => setIntakeStudentName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #</label>
                      <input type="text" required value={intakeStudentId} onChange={(e) => setIntakeStudentId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Grade</label>
                      <select value={intakeStudentGrade} onChange={(e) => setIntakeStudentGrade(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100">
                        <option value="9th Grade">9th Grade</option>
                        <option value="10th Grade">10th Grade</option>
                        <option value="11th Grade">11th Grade</option>
                        <option value="12th Grade">12th Grade</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Campus</label>
                      <input type="text" required value={intakeSchool} onChange={(e) => setIntakeSchool(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">TIPS #</label>
                      <input type="text" required value={intakeTipsNum} onChange={(e) => setIntakeTipsNum(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowNewIntakeModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white px-5 py-2 rounded font-semibold">Initialize Case Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ARCHIVE CASE MODAL */}
          {showCloseCaseModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-100">Archive Case Record</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Archive Date</label>
                    <input type="date" required value={closeCaseDate} onChange={(e) => setCloseCaseDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Resolution Notes</label>
                    <textarea rows="3" required value={closeCaseNotes} onChange={(e) => setCloseCaseNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-100" />
                  </div>
                </div>
                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                  <button onClick={() => setShowCloseCaseModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded">Cancel</button>
                  <button onClick={handleConfirmCloseCase} className="bg-amber-600 text-white px-4 py-2 rounded font-semibold">Confirm & Archive</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
