        ],
        docs: {
          student: { uploaded: true, date: "2026-09-21", filename: "Marcus_Vance_Student.pdf" },
          parent: { uploaded: true, date: "2026-09-21", filename: "Vance_Parent_Interview.pdf" },

        },

        ]
      },
      {
        id: "554109",

        cstagClassification: "Transient Threat",
        threatBrief: "Frustrated comment made in hallway after test score released; confirmed non-substantive upon interview.",
        planStatus: "Case Closed / Archived",
        isSuspended: false,
        reEntryDate: "",

        safetyPlan: { startDate: "", nextMtgDate: "", endDate: "", docFilename: "" },
        lastOutreachDate: "2026-09-12",
        outreachLogs: [
          { id: 1, date: "2026-09-12", contactType: "Parent Contact", teamMember: "David Ross (Counselor)", notes: "Notified parent of transient determination. Case resolved." }
        ],
        docs: {
          student: { uploaded: true, date: "2026-09-10", filename: "Chloe_Bennett_Interview.pdf" },
          parent: { uploaded: true, date: "2026-09-11", filename: "Bennett_Parent.pdf" },
          witness: { uploaded: true, date: "2026-09-10", filename: "Hallway_Witness_Notes.pdf" },
          records: { uploaded: true, date: "2026-09-10", filename: "Bennett_Records.pdf" }
        },
        pathwayStage: 1,
        pathwayTimeline: [
          { date: "2026-09-10", stage: "1. Grievance", desc: "Frustration regarding test performance." }
        ]
      }
    ];

    let currentCaseId = null;
    let activeMainTab = "dashboard";
    let activeDocTab = "student";
    let pendingTriageData = null;

    // --- INITIALIZATION ---
    document.addEventListener("DOMContentLoaded", function() {
      renderDashboardMatrix();
      updateDashboardStats();
    });

    // --- TAB SWITCHING LOGIC ---
    function switchMainTab(tab) {
      activeMainTab = tab;
      document.querySelectorAll("nav button").forEach(btn => {
        btn.className = "px-4 py-2 font-semibold text-sm rounded-md text-slate-600 hover:bg-slate-50";
      });
      
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.className = "px-4 py-2 font-semibold text-sm rounded-md bg-blue-50 text-blue-700 border-b-2 border-blue-600";
      }

      document.getElementById("view-dashboard").classList.add("hidden");
      document.getElementById("view-case-detail").classList.add("hidden");

      if (tab === "dashboard" || tab === "medium-high" || tab === "low" || tab === "closed") {
        document.getElementById("view-dashboard").classList.remove("hidden");
        renderDashboardMatrix(tab);
      }
    }

    // --- RENDER MATRIX TABLE ---
    function renderDashboardMatrix(filter = "dashboard") {
      const tbody = document.getElementById("matrix-tbody");
      tbody.innerHTML = "";

      let filteredCases = btamCases.filter(c => {
        if (filter === "medium-high") return c.riskLevel === "High" || c.riskLevel === "Medium";
        if (filter === "low") return c.riskLevel === "Low" && c.planStatus !== "Case Closed / Archived";
        if (filter === "closed") return c.planStatus === "Case Closed / Archived";
        return true;
      });

      filteredCases.forEach(c => {
        const riskColor = c.riskLevel === "High" ? "bg-red-100 text-red-800 border-red-300" :
                          c.riskLevel === "Medium" ? "bg-amber-100 text-amber-800 border-amber-300" :
                          "bg-blue-100 text-blue-800 border-blue-300";

        const nextMtg = c.safetyPlan.nextMtgDate || c.supportPlan.nextMtgDate || "N/A";
        const missingDocs = Object.values(c.docs).some(d => !d.uploaded);

        // Suspension Badge
        const suspensionBadge = c.isSuspended 
          ? `<span class="bg-purple-100 text-purple-800 border border-purple-300 text-[10px] px-2 py-0.5 rounded font-bold block mt-1"><i class="fa-solid fa-ban mr-1"></i>Suspended (Re-entry: ${c.reEntryDate || 'TBD'})</span>`
          : `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] px-2 py-0.5 rounded font-medium block mt-1"><i class="fa-solid fa-school mr-1"></i>In School</span>`;

        const row = document.createElement("tr");
        row.className = "hover:bg-slate-50 border-b border-slate-200";
        row.innerHTML = `
          <td class="py-3 px-4 font-bold text-slate-800">
            <button onclick="openCaseDetail('${c.id}')" class="text-blue-600 hover:underline text-left">
              ${c.title}
            </button>
            ${suspensionBadge}
          </td>
          <td class="py-3 px-4">${c.school}</td>
          <td class="py-3 px-4 font-mono">${c.tipsNum}</td>
          <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${riskColor}">${c.riskLevel}</span></td>
          <td class="py-3 px-4">${c.cstagClassification}</td>
          <td class="py-3 px-4 font-medium">${c.planStatus}</td>
          <td class="py-3 px-4 font-mono">${nextMtg}</td>
          <td class="py-3 px-4">
            ${missingDocs ? '<span class="text-red-600 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Incomplete</span>' : '<span class="text-green-600 font-bold"><i class="fa-solid fa-circle-check"></i> Complete</span>'}
          </td>
          <td class="py-3 px-4 text-right space-x-1">
            <button onclick="openCaseDetail('${c.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1 rounded font-semibold text-xs">
              Open Case
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // --- SEARCH FILTER ---
    function filterTable() {
      const query = document.getElementById("table-search").value.toLowerCase();
      const rows = document.querySelectorAll("#matrix-tbody tr");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(query) ? "" : "none";
      });
    }

    // --- DASHBOARD STATS ---
    function updateDashboardStats() {
      document.getElementById("stat-total").innerText = btamCases.length;
      document.getElementById("stat-high").innerText = btamCases.filter(c => c.riskLevel === "High").length;
      document.getElementById("stat-medium").innerText = btamCases.filter(c => c.riskLevel === "Medium").length;
      
      const missingCount = btamCases.filter(c => Object.values(c.docs).some(d => !d.uploaded)).length;
      document.getElementById("stat-missing-docs").innerText = missingCount;

      document.getElementById("count-med-high").innerText = btamCases.filter(c => c.riskLevel === "High" || c.riskLevel === "Medium").length;
      document.getElementById("count-low").innerText = btamCases.filter(c => c.riskLevel === "Low" && c.planStatus !== "Case Closed / Archived").length;
      document.getElementById("count-closed").innerText = btamCases.filter(c => c.planStatus === "Case Closed / Archived").length;
    }

    // --- OPEN CASE DETAIL ---
    function openCaseDetail(id) {
      currentCaseId = id;
      const c = btamCases.find(item => item.id === id);
      if (!c) return;

      document.getElementById("view-dashboard").classList.add("hidden");
      document.getElementById("view-case-detail").classList.remove("hidden");

      // Detail Header
      document.getElementById("detail-header-info").innerHTML = `
        <h2 class="text-base font-bold text-slate-900">${c.title} • <span class="text-slate-500 font-normal">${c.school}</span></h2>
        <p class="text-xs text-slate-500">TIPS Case Ref #: <strong>${c.tipsNum}</strong> | CSTAG Level: <strong>${c.riskLevel}</strong> (${c.cstagClassification})</p>
      `;

      document.getElementById("detail-header-actions").innerHTML = `
        <button onclick="toggleCloseCase('${c.id}')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1">
          <i class="fa-solid fa-box-archive"></i> ${c.planStatus === "Case Closed / Archived" ? "Re-Open Case" : "Archive / Close Case"}
        </button>
      `;

      // Threat Brief
      document.getElementById("case-brief-text").innerText = c.threatBrief;

      // Plans Inputs
      document.getElementById("support-start-date").value = c.supportPlan.startDate || "";
      document.getElementById("support-next-date").value = c.supportPlan.nextMtgDate || "";
      document.getElementById("support-end-date").value = c.supportPlan.endDate || "";
      document.getElementById("support-doc-filename").innerText = c.supportPlan.docFilename || "No support plan file attached.";

      document.getElementById("safety-start-date").value = c.safetyPlan.startDate || "";
      document.getElementById("safety-next-date").value = c.safetyPlan.nextMtgDate || "";
      document.getElementById("safety-end-date").value = c.safetyPlan.endDate || "";
      document.getElementById("safety-doc-filename").innerText = c.safetyPlan.docFilename || "No safety plan file attached.";

      // Document Tabs
      switchDocTab(activeDocTab);

      // Pathway & Workflow
      renderPathwayTimeline(c);
      renderStepDetail(1);

      // Render Suspension Panel & Team Outreach Panel
      renderSuspensionPanel(c);
      renderOutreachLog(c);
    }

    // --- SUSPENSION & RE-ENTRY PANEL LOGIC ---
    function renderSuspensionPanel(c) {
      let container = document.getElementById("suspension-panel-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "suspension-panel-container";
        container.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4 my-6";
        const target = document.getElementById("pathway-section");
        target.parentNode.insertBefore(container, target);
      }

      container.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-user-clock text-purple-600"></i> Student Suspension & Re-Entry Status
          </h3>
          <span class="text-[10px] bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded">Administrative Action Tracker</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs bg-purple-50/50 p-4 rounded-lg border border-purple-100">
          <div class="flex items-center space-x-3">
            <input type="checkbox" id="suspension-toggle" ${c.isSuspended ? "checked" : ""} onchange="updateSuspensionStatus()" class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500 cursor-pointer">
            <label for="suspension-toggle" class="font-bold text-slate-800 cursor-pointer">Student Currently Suspended</label>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Target Re-Entry Date:</label>
            <input type="date" id="reentry-date-input" value="${c.reEntryDate || ''}" onchange="updateSuspensionStatus()" ${!c.isSuspended ? "disabled" : ""} class="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-purple-500 disabled:bg-slate-100 disabled:text-slate-400">
          </div>
          <div class="flex items-center">
            <div id="suspension-status-badge" class="w-full text-center p-2 rounded text-xs font-bold ${c.isSuspended ? 'bg-purple-200 text-purple-900 border border-purple-300' : 'bg-slate-200 text-slate-700'}">
              ${c.isSuspended ? `SUSPENDED (Return: ${c.reEntryDate || 'Unspecified'})` : 'ACTIVE IN CLASSROOM'}
            </div>
          </div>
        </div>
      `;
    }

    function updateSuspensionStatus() {
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      const isSuspended = document.getElementById("suspension-toggle").checked;
      const reEntryDate = document.getElementById("reentry-date-input").value;

      c.isSuspended = isSuspended;
      c.reEntryDate = reEntryDate;

      const dateInput = document.getElementById("reentry-date-input");
      dateInput.disabled = !isSuspended;

      const badge = document.getElementById("suspension-status-badge");
      if (isSuspended) {
        badge.className = "w-full text-center p-2 rounded text-xs font-bold bg-purple-200 text-purple-900 border border-purple-300";
        badge.innerHTML = `SUSPENDED (Return: ${reEntryDate || 'Unspecified'})`;
      } else {
        badge.className = "w-full text-center p-2 rounded text-xs font-bold bg-slate-200 text-slate-700";
        badge.innerHTML = "ACTIVE IN CLASSROOM";
      }

      renderDashboardMatrix(activeMainTab);
    }

    // --- TEAM OUTREACH LOGIC ---
    function renderOutreachLog(c) {
      let container = document.getElementById("outreach-panel-container");
      if (!container) {
        container = document.createElement("div");
        container.id = "outreach-panel-container";
        container.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4 my-6";
        const workflowSection = document.getElementById("workflow-section");
        workflowSection.parentNode.insertBefore(container, workflowSection);
      }

      if (!c.outreachLogs) c.outreachLogs = [];

      let logRows = c.outreachLogs.map(log => `
        <tr class="border-b border-slate-200 text-xs hover:bg-slate-50">
          <td class="py-2.5 px-3 font-mono text-slate-600">${log.date}</td>
          <td class="py-2.5 px-3"><span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-semibold text-[11px]">${log.contactType}</span></td>
          <td class="py-2.5 px-3 font-medium text-slate-800">${log.teamMember}</td>
          <td class="py-2.5 px-3 text-slate-600">${log.notes}</td>
        </tr>
      `).join("");

      if (c.outreachLogs.length === 0) {
        logRows = `<tr><td colspan="4" class="text-center py-4 text-slate-400 italic">No team outreach contacts logged yet.</td></tr>`;
      }

      container.innerHTML = `
        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-comments text-blue-600"></i> Team Communication & Stakeholder Outreach Log
          </h3>
          <span class="text-xs text-slate-500"><i class="fa-solid fa-clock-rotate-left"></i> Last Contact: ${c.lastOutreachDate || 'N/A'}</span>
        </div>

        <!-- NEW OUTREACH FORM -->
        <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200 text-xs space-y-3">
          <p class="font-bold text-slate-700 flex items-center gap-1"><i class="fa-solid fa-plus-circle text-blue-600"></i> Log New Team Outreach Touchpoint:</p>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
            <div>
              <label class="block text-slate-600 font-medium mb-1">Contact Date</label>
              <input type="date" id="outreach-date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Contact Type</label>
              <select id="outreach-type" class="w-full p-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-blue-500">
                <option value="Parent Contact">Parent / Guardian Contact</option>
                <option value="SRO / Police">SRO / District Security</option>
                <option value="Mental Health">Mental Health / Counselor</option>
                <option value="OESS / IEP Team">OESS / IEP Team</option>
                <option value="District Legal">District Legal / Compliance</option>
                <option value="Community Support">Community Support Partner</option>
              </select>
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Team Member Name</label>
              <input type="text" id="outreach-member" placeholder="e.g., Jane Doe (Counselor)" class="w-full p-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-slate-600 font-medium mb-1">Action Notes</label>
              <input type="text" id="outreach-notes" placeholder="Brief summary of discussion..." class="w-full p-2 border border-slate-300 rounded bg-white focus:ring-1 focus:ring-blue-500">
            </div>
          </div>
          <div class="flex justify-end">
            <button onclick="saveOutreachEntry()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-1.5 rounded text-xs flex items-center gap-1 transition">
              <i class="fa-solid fa-floppy-disk"></i> Save Contact Entry
            </button>
          </div>
        </div>

        <!-- OUTREACH HISTORY TABLE -->
        <div class="overflow-x-auto border border-slate-200 rounded-lg">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200 uppercase tracking-wider">
              <tr>
                <th class="py-2.5 px-3">Date</th>
                <th class="py-2.5 px-3">Contact Type</th>
                <th class="py-2.5 px-3">Team Member</th>
                <th class="py-2.5 px-3">Outreach Summary & Notes</th>
              </tr>
            </thead>
            <tbody>
              ${logRows}
            </tbody>
          </table>
        </div>
      `;
    }

    function saveOutreachEntry() {
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      const date = document.getElementById("outreach-date").value;
      const type = document.getElementById("outreach-type").value;
      const member = document.getElementById("outreach-member").value.trim();
      const notes = document.getElementById("outreach-notes").value.trim();

      if (!member || !notes) {
        alert("Please provide both the Team Member Name and Action Notes before saving.");
        return;
      }

      if (!c.outreachLogs) c.outreachLogs = [];

      c.outreachLogs.unshift({
        id: Date.now(),
        date: date,
        contactType: type,
        teamMember: member,
        notes: notes
      });

      c.lastOutreachDate = date;

      renderOutreachLog(c);
    }

    // --- PLAN UPDATE HANDLERS ---
    function updateSupportPlanData() {
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;
      c.supportPlan.startDate = document.getElementById("support-start-date").value;
      c.supportPlan.nextMtgDate = document.getElementById("support-next-date").value;
      c.supportPlan.endDate = document.getElementById("support-end-date").value;
      renderDashboardMatrix(activeMainTab);
    }

    function updateSafetyPlanData() {
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;
      c.safetyPlan.startDate = document.getElementById("safety-start-date").value;
      c.safetyPlan.nextMtgDate = document.getElementById("safety-next-date").value;
      c.safetyPlan.endDate = document.getElementById("safety-end-date").value;
      renderDashboardMatrix(activeMainTab);
    }

    // --- DOCUMENT TAB SWITCHING ---
    function switchDocTab(tabKey) {
      activeDocTab = tabKey;
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      ["student", "parent", "witness", "records"].forEach(k => {
        const btn = document.getElementById(`doc-tab-${k}`);
        if (btn) {
          btn.className = k === tabKey 
            ? "px-4 py-2.5 rounded-t-lg border-t border-x border-slate-300 bg-slate-50 text-blue-700 font-bold"
            : "px-4 py-2.5 rounded-t-lg border-t border-x border-transparent hover:bg-slate-50 text-slate-600";
        }
      });

      const doc = c.docs[tabKey];
      const content = document.getElementById("doc-tab-content");
      content.innerHTML = `
        <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-slate-200">
          <div>
            <p class="font-bold text-slate-800 text-xs">Category Document Status:</p>
            <p class="text-xs text-slate-500 mt-0.5">
              ${doc.uploaded ? `<span class="text-green-600 font-bold"><i class="fa-solid fa-circle-check"></i> File Attached: ${doc.filename} (${doc.date})</span>` : '<span class="text-red-500 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Missing Document Upload</span>'}
            </p>
          </div>
          <div>
            <input type="file" id="tab-doc-input" class="hidden" onchange="uploadTabDoc(event, '${tabKey}')">
            <button onclick="triggerFileInput('tab-doc-input')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded font-semibold text-xs">
              ${doc.uploaded ? "Replace Document" : "Upload Document"}
            </button>
          </div>
        </div>
      `;
    }

    function uploadTabDoc(event, tabKey) {
      const file = event.target.files[0];
      if (!file) return;
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      c.docs[tabKey] = {
        uploaded: true,
        date: new Date().toISOString().split('T')[0],
        filename: file.name
      };

      switchDocTab(tabKey);
      updateDashboardStats();
      renderDashboardMatrix(activeMainTab);
    }

    function uploadSupportDoc(event) {
      const file = event.target.files[0];
      if (!file) return;
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      c.supportPlan.docFilename = file.name;
      document.getElementById("support-doc-filename").innerText = file.name;
    }

    function uploadSafetyDoc(event) {
      const file = event.target.files[0];
      if (!file) return;
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      c.safetyPlan.docFilename = file.name;
      document.getElementById("safety-doc-filename").innerText = file.name;
    }

    function triggerFileInput(id) {
      document.getElementById(id).click();
    }

    // --- PATHWAY TIMELINE ---
    function renderPathwayTimeline(c) {
      const container = document.getElementById("pathway-timeline-events");
      container.innerHTML = "";

      c.pathwayTimeline.forEach(ev => {
        const el = document.createElement("div");
        el.className = "bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs";
        el.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-800">${ev.stage}</span>
            <span class="text-slate-400 font-mono text-[11px]">${ev.date}</span>
          </div>
          <p class="text-slate-600 mt-1">${ev.desc}</p>
        `;
        container.appendChild(el);
      });
    }

    // --- WORKFLOW 10 STEPS ---
    function renderStepDetail(stepNum) {
      for (let i = 1; i <= 10; i++) {
        const btn = document.getElementById(`step-btn-${i}`);
        if (btn) btn.className = i === stepNum ? "p-2 rounded border text-left font-bold step-active" : "p-2 rounded border text-left font-medium text-slate-600 hover:bg-slate-50";
      }

      const stepTitles = [
        "1. Intake & Initial Triage", "2. Threat Team Activation", "3. 360-Degree Assessment",
        "4. CSTAG Threat Classification", "5. Transient Threat Resolution", "6. Substantive Threat Response",
        "7. Safety & Management Plan", "8. Formal Mental Health Evaluation", "9. Implementation & Monitoring", "10. Case Retirement"
      ];

      const stepDescs = [
        "Receive intake report via TIPS, law enforcement, or staff. Verify immediacy of threat.",
        "Assemble multidisciplinary BTAM team including administrator, counselor, SRO, and OESS (if IEP present).",
        "Conduct student interview, parent contact, witness interviews, and student record review.",
        "Categorize threat according to CSTAG model (Transient vs Serious/Very Serious Substantive).",
        "Implement non-punitive dispute resolution for transient comments.",
        "Initiate protective measures, law enforcement coordination, and victim support.",
        "Formulate individual management plan with specific timeline and dates.",
        "Conduct psychological or safety evaluation if high risk is determined.",
        "Monitor student compliance and schedule periodic progress checks.",
        "Archive case when risk drops and student completes required re-entry milestones."
      ];

      document.getElementById("step-detail-container").innerHTML = `
        <h4 class="font-bold text-slate-800 text-sm mb-1">${stepTitles[stepNum - 1]}</h4>
        <p class="text-slate-600 leading-relaxed">${stepDescs[stepNum - 1]}</p>
      `;
    }

    // --- MODAL CONTROLS & INTAKE PARSER ---
    function openNewIntakeModal() {
      document.getElementById("modal-intake").classList.remove("hidden");
    }

    function closeNewIntakeModal() {
      document.getElementById("modal-intake").classList.add("hidden");
      document.getElementById("tips-parsed-preview").classList.add("hidden");
      document.getElementById("btn-proceed-triage").disabled = true;
    }

    function handleTipsUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      pendingTriageData = {
        studentName: "Derrick Thompson",
        id: "782103",
        school: "Capitol Hill High School",
        tipsNum: `26-0${Math.floor(1000 + Math.random() * 9000)}`,
        brief: "Student made violent statement in cafeteria following physical altercation."
      };

      document.getElementById("parse-student").innerText = pendingTriageData.studentName;
      document.getElementById("parse-id").innerText = pendingTriageData.id;
      document.getElementById("parse-school").innerText = pendingTriageData.school;
      document.getElementById("parse-tips").innerText = pendingTriageData.tipsNum;
      document.getElementById("parse-brief").value = pendingTriageData.brief;

      document.getElementById("tips-parsed-preview").classList.remove("hidden");
      document.getElementById("btn-proceed-triage").disabled = false;
    }

    function proceedToTriageModal() {
      closeNewIntakeModal();
      document.getElementById("modal-triage").classList.remove("hidden");
    }

    function closeTriageModal() {
      document.getElementById("modal-triage").classList.add("hidden");
    }

    function calculateTriageScore() {
      const form = document.getElementById("triage-form");
      const q1 = parseInt(form.q1.value);
      const q1a = parseInt(form.q1a.value);
      const q2 = parseInt(form.q2.value);
      const q3 = parseInt(form.q3.value);
      const q4 = parseInt(form.q4.value);

      const total = q1 + q1a + q2 + q3 + q4;
      const badge = document.getElementById("calculated-risk-badge");

      if (total >= 11) {
        badge.innerText = "HIGH RISK";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-600 text-white";
      } else if (total >= 7) {
        badge.innerText = "MEDIUM RISK";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-amber-500 text-white";
      } else {
        badge.innerText = "LOW RISK";
        badge.className = "px-3 py-1 rounded-full text-xs font-bold bg-blue-500 text-white";
      }
    }

    function submitTriageAndCreateCase() {
      if (!pendingTriageData) return;

      const badgeText = document.getElementById("calculated-risk-badge").innerText;
      const riskLevel = badgeText.includes("HIGH") ? "High" : badgeText.includes("MEDIUM") ? "Medium" : "Low";

      const newCase = {
        id: pendingTriageData.id,
        studentName: pendingTriageData.studentName,
        title: `${pendingTriageData.studentName} (#${pendingTriageData.id})`,
        school: pendingTriageData.school,
        tipsNum: pendingTriageData.tipsNum,
        riskLevel: riskLevel,
        cstagClassification: riskLevel === "High" ? "Very Serious Substantive" : riskLevel === "Medium" ? "Serious Substantive" : "Transient Threat",
        threatBrief: document.getElementById("parse-brief").value,
        planStatus: "Active Assessment",
        isSuspended: riskLevel !== "Low",
        reEntryDate: "",
        supportPlan: { startDate: new Date().toISOString().split('T')[0], nextMtgDate: "", endDate: "", docFilename: "" },
        safetyPlan: { startDate: "", nextMtgDate: "", endDate: "", docFilename: "" },
        lastOutreachDate: new Date().toISOString().split('T')[0],
        outreachLogs: [
          { id: 1, date: new Date().toISOString().split('T')[0], contactType: "Intake Triage", teamMember: "System Intake", notes: "Case created from TIPS report PDF." }
        ],
        docs: {
          student: { uploaded: false, date: "", filename: "" },
          parent: { uploaded: false, date: "", filename: "" },
          witness: { uploaded: false, date: "", filename: "" },
          records: { uploaded: false, date: "", filename: "" }
        },
        pathwayStage: 1,
        pathwayTimeline: [
          { date: new Date().toISOString().split('T')[0], stage: "1. Grievance", desc: pendingTriageData.brief }
        ]
      };

      btamCases.unshift(newCase);
      closeTriageModal();
      updateDashboardStats();
      renderDashboardMatrix(activeMainTab);
      openCaseDetail(newCase.id);
    }

    function toggleCloseCase(id) {
      const c = btamCases.find(item => item.id === id);
      if (!c) return;

      if (c.planStatus === "Case Closed / Archived") {
        c.planStatus = "Active Support Plan";
      } else {
        c.planStatus = "Case Closed / Archived";
      }

      openCaseDetail(id);
      updateDashboardStats();
      renderDashboardMatrix(activeMainTab);
    }

    function editCaseBrief() {
      const c = btamCases.find(item => item.id === currentCaseId);
      if (!c) return;

      const newBrief = prompt("Edit Threat Brief Summary:", c.threatBrief);
      if (newBrief !== null && newBrief.trim() !== "") {
        c.threatBrief = newBrief.trim();
        document.getElementById("case-brief-text").innerText = c.threatBrief;
      }
    }
  </script>
