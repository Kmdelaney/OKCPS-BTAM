        pathwayEvents: []

    function App() {
      const [cases, setCases] = useState(INITIAL_CASES);
      const [mainTab, setMainTab] = useState('active'); // active, low, noTriage, closed, dashboard
      const [selectedCaseId, setSelectedCaseId] = useState(INITIAL_CASES[0].id);
      const [activeDocTab, setActiveDocTab] = useState('studentInterview');

      // Modals
      const [showNewIntakeModal, setShowNewIntakeModal] = useState(false);
      const [showCloseCaseModal, setShowCloseCaseModal] = useState(false);

      // Close Case Form
      const [closeCaseDate, setCloseCaseDate] = useState(new Date().toISOString().split('T')[0]);
      const [closeCaseNotes, setCloseCaseNotes] = useState('');

      // New Intake Form Upload States
      const [uploadedTipsFile, setUploadedTipsFile] = useState(null);
      const [uploadedTriageFile, setUploadedTriageFile] = useState(null);
      const [detectedTriageScore, setDetectedTriageScore] = useState('Pending Triage');

      // Intake Fields
      const [intakeStudentName, setIntakeStudentName] = useState('');
      const [intakeStudentId, setIntakeStudentId] = useState('');
      const [intakeSchool, setIntakeSchool] = useState('');
      const [intakeBrief, setIntakeBrief] = useState('');
      const [intakeTipsNum, setIntakeTipsNum] = useState('');
      const [intakeIsIep, setIntakeIsIep] = useState(false);
      const [intakeSuspended, setIntakeSuspended] = useState(false);
      const [intakeReEntryDate, setIntakeReEntryDate] = useState('');

      // Filtered Case Categories
      const activeMediumHighCases = cases.filter(c => c.triageCompleted && (c.triagePriority === 'Medium' || c.triagePriority === 'High') && c.caseStatus !== 'Closed');
      const lowRiskCases = cases.filter(c => c.triageCompleted && c.triagePriority === 'Low' && c.caseStatus !== 'Closed');
      const openNoTriageCases = cases.filter(c => !c.triageCompleted && c.caseStatus !== 'Closed');
      const closedCases = cases.filter(c => c.caseStatus === 'Closed');

      // Safely select active case
      const currentCase = cases.find(c => c.id === selectedCaseId) || activeMediumHighCases[0] || openNoTriageCases[0] || cases[0];

      // Handle Document Upload per Category Tab
      const handleFileUpload = (category, e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;

        const newDoc = {
          name: file.name,
          uploadDate: new Date().toISOString().split('T')[0],
          size: `${(file.size / 1024).toFixed(0)} KB`
        };

        const updatedCases = cases.map(c => {
          if (c.id === currentCase.id) {
            const updatedDocs = {
              ...c.documents,
              [category]: [...(c.documents[category] || []), newDoc]
            };
            return { ...c, documents: updatedDocs };
          }
          return c;
        });

        setCases(updatedCases);
      };

      // TIPS PDF Parser Simulation
      const handleTipsFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setUploadedTipsFile(file);
          setTimeout(() => {
            setIntakeStudentName('Jorge Jimenez');
            setIntakeStudentId('345290');
            setIntakeSchool('Capitol Hill High School');
            setIntakeTipsNum('26-03093');
            setIntakeBrief('Reported online threats, firearm-related imagery on Instagram highlights, and alleged stalking/intimidation behavior toward peers.');
            setIntakeSuspended(true);
            setIntakeReEntryDate('2026-09-21');
          }, 300);
        }
      };

      // Triage PDF Analysis Parser Simulation
      const handleTriageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setUploadedTriageFile(file);
          // Auto-detect score based on filename or contents simulation
          setTimeout(() => {
            const fname = file.name.toUpperCase();
            if (fname.includes('HIGH')) setDetectedTriageScore('High');
            else if (fname.includes('MED')) setDetectedTriageScore('Medium');
            else if (fname.includes('LOW')) setDetectedTriageScore('Low');
            else setDetectedTriageScore('High'); // Default calculated score from sample JJ Triage - HIGH.pdf
          }, 300);
        }
      };

      // Create New Case & Link Uploaded Documents
      const handleCreateCase = (e) => {
        e.preventDefault();
        
        // Check previous history
        const pastMatches = cases.filter(c => c.studentId === intakeStudentId && intakeStudentId.trim() !== '');

        const autoRecordsDocs = [];
        if (pastMatches.length > 0) {
          autoRecordsDocs.push({
            name: `Prior_System_Incident_Summary_ID_${intakeStudentId}.pdf`,
            uploadDate: new Date().toISOString().split('T')[0],
            size: '520 KB'
          });
        }

        const isTriageProvided = !!uploadedTriageFile;
        const finalPriority = isTriageProvided ? detectedTriageScore : 'Pending Triage';

        const newCase = {
          id: intakeTipsNum || `26-${Math.floor(1000 + Math.random() * 9000)}`,
          studentName: intakeStudentName,
          studentId: intakeStudentId,
          schoolLocation: intakeSchool || 'OKCPS Campus',
          tovBrief: intakeBrief,
          incidentDate: new Date().toISOString().split('T')[0],
          dateReported: new Date().toISOString().split('T')[0],
          tipsReportNum: intakeTipsNum,
          triagePriority: finalPriority,
          triageCompleted: isTriageProvided,
          cstagClassification: !isTriageProvided ? 'Pending Assessment' : finalPriority === 'Low' ? 'Transient Threat' : 'Substantive Threat',
          isIep: intakeIsIep,
          suspended: intakeSuspended,
          reEntryDate: intakeSuspended ? (intakeReEntryDate || 'Pending') : 'N/A',
          caseStatus: 'Active',
          closeDate: '',
          planStartDate: '',
          planNextMeeting: '',
          planEndDate: '',
          supportPlanStatus: isTriageProvided ? 'Active Monitoring' : 'Awaiting Triage & Core Team Activation',
          lastTeamContactDate: new Date().toISOString().split('T')[0],
          teamReachoutCount: 1,
          pastTovCount: pastMatches.length,
          previousTovHistory: pastMatches.map(m => ({ date: m.incidentDate, brief: m.tovBrief, actionTaken: m.supportPlanStatus })),
          // Saved Intake Documents
          intakeFiles: {
            tipsPdf: uploadedTipsFile ? { name: uploadedTipsFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '1.2 MB' } : null,
            triagePdf: uploadedTriageFile ? { name: uploadedTriageFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '540 KB', scoreDetected: finalPriority } : null
          },
          documents: {
            studentInterview: [],
            parentInterview: [],
            witnessStatements: [],
            recordsReview: autoRecordsDocs
          },
          pathwayEvents: (isTriageProvided && finalPriority !== 'Low') ? [
            { id: Date.now(), stage: 'Grievance', description: `Initial threat logged via TIPS #${intakeTipsNum}`, date: new Date().toISOString().split('T')[0] }
          ] : []
        };

        setCases([newCase, ...cases]);
        setSelectedCaseId(newCase.id);
        setShowNewIntakeModal(false);

        // Reset Modal Form
        setUploadedTipsFile(null);
        setUploadedTriageFile(null);
        setDetectedTriageScore('Pending Triage');

        // Route to correct tab
        if (!isTriageProvided) setMainTab('noTriage');
        else if (finalPriority === 'Low') setMainTab('low');
        else setMainTab('active');
      };

      // Close Case Action
      const handleConfirmCloseCase = () => {
        if (!currentCase) return;

        const updatedCases = cases.map(c => {
          if (c.id === currentCase.id) {
            return {
              ...c,
              caseStatus: 'Closed',
              closeDate: closeCaseDate,
              supportPlanStatus: `Closed (${closeCaseDate}): ${closeCaseNotes}`
            };
          }
          return c;
        });

        setCases(updatedCases);
        setShowCloseCaseModal(false);
        setCloseCaseNotes('');
        setMainTab('closed');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">

          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-40 backdrop-blur">

              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 text-blue-400 rounded-lg font-bold text-lg">🛡️</div>
                <div>
                  <h1 className="text-base font-bold text-slate-100">OKCPS Behavioral Threat Assessment System</h1>
                  <p className="text-[11px] text-slate-400">CSTAG Protocol Engine • FERPA & HIPAA Compliant</p>
                </div>
              </div>

              <button
                onClick={() => setShowNewIntakeModal(true)}
                className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-all shadow-md shadow-blue-600/20"
              >
                + New Threat Intake (TIPS & Triage PDF)
              </button>
            </div>
          </header>

          {/* EMERGENCY ALERT BANNERS */}
          {currentCase?.triagePriority === 'High' && mainTab !== 'dashboard' && currentCase.caseStatus !== 'Closed' && (
            <div className="bg-red-950/90 border-b border-red-800 text-red-200 px-4 py-2 text-xs flex items-center justify-between animate-pulse">
              <div className="max-w-7xl mx-auto w-full flex items-center space-x-2">
                <span className="text-red-400 font-bold">⚠️</span>
                <span className="font-semibold">
                  HIGH RISK ASSESSMENT ACTIVE: Automated Dispatch Notification routed to District Security (405-587-SAFE) & Mental Health Department.
                </span>
              </div>
            </div>
          )}

          {currentCase?.isIep && mainTab !== 'dashboard' && currentCase.caseStatus !== 'Closed' && (
            <div className="bg-amber-950/90 border-b border-amber-800 text-amber-200 px-4 py-2 text-xs">
              <div className="max-w-7xl mx-auto w-full flex items-center space-x-2 font-semibold">
                <span className="text-amber-400">🔒</span>
                <span>AUTOMATED IEP / OESS ALERT: OESS MUST be consulted for all students on an IEP.</span>
              </div>
            </div>
          )}

          {/* NAVIGATION TABS WITH CASE COUNTERS */}
          <div className="max-w-7xl mx-auto px-4 pt-4">
            <div className="flex border-b border-slate-800 space-x-6 text-xs font-semibold overflow-x-auto">
              <button
                onClick={() => { setMainTab('active'); if (activeMediumHighCases.length > 0) setSelectedCaseId(activeMediumHighCases[0].id); }}
                className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${
                  mainTab === 'active' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                Active Medium/High Cases ({activeMediumHighCases.length})
              </button>

              <button
                onClick={() => { setMainTab('low'); if (lowRiskCases.length > 0) setSelectedCaseId(lowRiskCases[0].id); }}
                className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${
                  mainTab === 'low' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                Low-Risk Cases ({lowRiskCases.length})
              </button>

              <button
                onClick={() => { setMainTab('noTriage'); if (openNoTriageCases.length > 0) setSelectedCaseId(openNoTriageCases[0].id); }}
                className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${
                  mainTab === 'noTriage' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                Open Cases without Triage ({openNoTriageCases.length})
              </button>

              <button
                onClick={() => { setMainTab('closed'); if (closedCases.length > 0) setSelectedCaseId(closedCases[0].id); }}
                className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${
                  mainTab === 'closed' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                Closed Cases Archive ({closedCases.length})
              </button>

              <button
                onClick={() => setMainTab('dashboard')}
                className={`pb-3 border-b-2 whitespace-nowrap transition-colors ${
                  mainTab === 'dashboard' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'

          {/* CLOSE CASE MODAL */}
          {showCloseCaseModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-100">Close Case & Move to Archive</h3>

                <p className="text-xs text-slate-300">
                  You are closing case <strong>{currentCase?.studentName} (#{currentCase?.studentId})</strong>. This will move the case into the <strong>Closed Cases Archive</strong>.
                </p>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Case Close Date</label>
                    <input
                      type="date"
                      required
                      value={closeCaseDate}
                      onChange={(e) => setCloseCaseDate(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Resolution / Action Steps Taken</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Specify resolution steps, support outcomes, or mediation actions taken..."
                      value={closeCaseNotes}
                      onChange={(e) => setCloseCaseNotes(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:outline-none focus:border-blue-500"
                    />
                  </div>
                </div>

                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                  <button onClick={() => setShowCloseCaseModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded font-semibold">
                    Cancel
                  </button>
                  <button onClick={handleConfirmCloseCase} className="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded font-semibold">
                    Confirm & Move to Closed Archive
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
