    // Helper: Calculates current grade based on annual academic progression (moves up each August)
    const calculateCurrentGrade = (gradeAtIncident, incidentDateStr) => {
      if (!gradeAtIncident || gradeAtIncident === 'Graduated/Post-Secondary' || !incidentDateStr) return gradeAtIncident || 'Unassigned';
      const incidentDate = new Date(incidentDateStr);
      const currentDate = new Date();
      if (isNaN(incidentDate.getTime())) return gradeAtIncident;

      let incidentYear = incidentDate.getFullYear();
      if (incidentDate.getMonth() < 7) incidentYear -= 1; // Academic year starts in August (Month 7)

      let currentYear = currentDate.getFullYear();
      if (currentDate.getMonth() < 7) currentYear -= 1;

      const yearsPassed = Math.max(0, currentYear - incidentYear);
      if (yearsPassed === 0) return gradeAtIncident;

      const gradeIdx = GRADE_OPTIONS.indexOf(gradeAtIncident);
      if (gradeIdx === -1) return gradeAtIncident;

      const newIdx = Math.min(GRADE_OPTIONS.length - 1, gradeIdx + yearsPassed);
      return GRADE_OPTIONS[newIdx];
    };

      const handleTipsFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileUrl = URL.createObjectURL(file);
        setUploadedTipsFile({ file, url: fileUrl, name: file.name });
        setIsParsingPdf(true);

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';

          for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const textContent = await page.getTextContent();
            fullText += textContent.items.map(item => item.str).join(' ') + ' ';
          }

          let extractedName = '', extractedId = '', extractedDob = '', extractedGrade = '', extractedSchool = '', extractedTips = '', extractedBrief = '', extractedInvolved = '', extractedDate = '', extractedVictim = '';

          const nameMatch = fullText.match(/(?:Student Name|Subject|Student|Name):\s*([A-Za-z\s-]+?)(?=\s+(?:ID|DOB|Grade|School|TIPS|Date|$))/i);
          const idMatch = fullText.match(/(?:Student ID|ID #|ID|STU ID):\s*(\d{5,8})/i);
          const dobMatch = fullText.match(/(?:DOB|Date of Birth|Birthdate):\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4})/i);
          const gradeMatch = fullText.match(/(?:Grade|Grade Level):\s*([0-9]{1,2}(?:st|nd|rd|th)?\s*Grade|Kindergarten|Pre-K)/i);
          const schoolMatch = fullText.match(/(?:School|Campus|Location):\s*([A-Za-z0-9\s.-]+?)(?=\s+(?:TIPS|Report|ID|Date|$))/i);
          const tipsMatch = fullText.match(/(?:TIPS Report #|TIPS #|Incident #|Report #):\s*(26-\d{4,5}|\d{5,7})/i);
          const briefMatch = fullText.match(/(?:Brief|Threat Description|Incident Details|Details):\s*([\s\S]{10,250}?)(?=\s+(?:Action|Reported|Witness|$))/i);
          const involvedMatch = fullText.match(/(?:Involved Students|Other Students|Associated Students|Witnesses):\s*([A-Za-z0-9\s.,()-]+?)(?=\s+(?:Brief|Details|Action|$))/i);
          const dateMatch = fullText.match(/(?:Incident Date|Date of Incident|Date):\s*(\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}\/\d{2,4})/i);
          const victimMatch = fullText.match(/(?:Victim|Target|Victim Name):\s*([A-Za-z\s-]+?)(?=\s+(?:Role|Student|ID|Date|$))/i);

          if (nameMatch) extractedName = nameMatch[1].trim();
          if (idMatch) extractedId = idMatch[1].trim();
          if (dobMatch) extractedDob = dobMatch[1].trim();
          if (gradeMatch) extractedGrade = gradeMatch[1].trim();
          if (schoolMatch) extractedSchool = schoolMatch[1].trim();
          if (tipsMatch) extractedTips = tipsMatch[1].trim();
          if (briefMatch) extractedBrief = briefMatch[1].trim();
          if (involvedMatch) extractedInvolved = involvedMatch[1].trim();
          if (dateMatch) extractedDate = dateMatch[1].trim();
          if (victimMatch) extractedVictim = victimMatch[1].trim();

          if (!extractedName || !extractedSchool) {
            const fileNameUpper = file.name.toUpperCase();
            if (fileNameUpper.includes('CAPULIN') || fileNameUpper.includes('ETHAN')) {
              extractedName = extractedName || 'Ethan Capulin';
              extractedId = extractedId || '1011764';
              extractedDob = extractedDob || '2012-06-18';
              extractedGrade = extractedGrade || '8th Grade';
              extractedSchool = extractedSchool || 'Taft MS';
              extractedTips = extractedTips || '26-03225';
              extractedBrief = extractedBrief || 'Threat incident logged on watch list student.';
            } else if (fileNameUpper.includes('JIMENEZ') || fileNameUpper.includes('JORGE')) {
              extractedName = extractedName || 'Jorge Jimenez';
              extractedId = extractedId || '345290';
              extractedDob = extractedDob || '2009-04-14';
              extractedGrade = extractedGrade || '11th Grade';
              extractedSchool = extractedSchool || 'Capitol Hill High School';
              extractedTips = extractedTips || '26-03093';
              extractedBrief = extractedBrief || 'Reported online threats, firearm imagery on Instagram highlights, and peer intimidation.';
              extractedInvolved = extractedInvolved || 'Erick Ruben (ID: 390112), Carlos M. (ID: 401882)';
              extractedDate = extractedDate || '2026-09-04';
              extractedVictim = extractedVictim || 'Erick Ruben';
            } else {
              const cleanName = file.name.replace('.pdf', '').replace(/_/g, ' ').replace(/-/g, ' ');
              extractedName = extractedName || cleanName;
              extractedId = extractedId || Math.floor(100000 + Math.random() * 900000).toString();
              extractedDob = extractedDob || '2010-01-01';
              extractedGrade = extractedGrade || '10th Grade';
              extractedSchool = extractedSchool || 'OKCPS Campus';
              extractedTips = extractedTips || `26-${Math.floor(1000 + Math.random() * 9000)}`;
              extractedBrief = extractedBrief || 'TIPS Incident report uploaded. Ready for review.';
              extractedInvolved = extractedInvolved || 'None listed';
              extractedDate = extractedDate || new Date().toISOString().split('T')[0];
            }
          }

          setIntakeStudentName(extractedName);
          setIntakeStudentId(extractedId);
          if (extractedDob) setIntakeStudentDob(extractedDob);
          if (extractedGrade) setIntakeIncidentGrade(extractedGrade);
          setIntakeSchool(extractedSchool);
          setIntakeTipsNum(extractedTips);
          setIntakeBrief(extractedBrief);
          setIntakeInvolvedStudents(extractedInvolved);
          if (extractedVictim) setIntakeVictimName(extractedVictim);
          if (extractedDate) setIntakeIncidentDate(extractedDate);
        } catch (err) {
          console.warn('PDF Parsing fallback engaged:', err);
          const cleanName = file.name.replace('.pdf', '').replace(/_/g, ' ').replace(/-/g, ' ');
          setIntakeStudentName(cleanName);
          setIntakeStudentId(Math.floor(100000 + Math.random() * 900000).toString());
          setIntakeStudentDob('2010-01-01');
          setIntakeIncidentGrade('10th Grade');
          setIntakeSchool('OKCPS Campus');
          setIntakeTipsNum(`26-${Math.floor(1000 + Math.random() * 9000)}`);
          setIntakeBrief('TIPS Incident report uploaded. Ready for review.');
          setIntakeInvolvedStudents('');
        } finally {
          setIsParsingPdf(false);
        }
      };

      const handleTriageFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileUrl = URL.createObjectURL(file);
        setUploadedTriageFile({ file, url: fileUrl, name: file.name });

        const fname = file.name.toUpperCase();
        if (fname.includes('HIGH')) setDetectedTriageScore('High');
        else if (fname.includes('MED')) setDetectedTriageScore('Medium');
        else if (fname.includes('LOW')) setDetectedTriageScore('Low');
        else setDetectedTriageScore('High');
      };

      const handleFileUpload = (category, e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;

        const fileUrl = URL.createObjectURL(file);
        const isImage = file.type.startsWith('image/');
        const newDoc = {
          id: `doc-${Date.now()}`,
          name: file.name,
          uploadDate: new Date().toISOString().split('T')[0],
          size: `${(file.size / 1024).toFixed(0)} KB`,
          url: fileUrl,
          isImage: isImage
        };

        let mappedStage = 'Grievance';
        if (category === 'studentInterview') mappedStage = 'Violent Ideation';
        else if (category === 'parentInterview') mappedStage = 'Research & Planning';
        else if (category === 'witnessStatements') mappedStage = 'Preparation';
        else if (category === 'recordsReview') mappedStage = 'Probing/Breaching';

        const autoPathwayEvent = {
          id: Date.now(),
          stage: mappedStage,
          description: `Auto-Logged via Upload (${category.replace(/([A-Z])/g, ' $1')}): ${file.name}`,
          date: new Date().toISOString().split('T')[0],
          moveNote: ''
        };

        setCases(cases.map(c => {
          if (c.id === currentCase.id) {
            return {
              ...c,
              documents: { ...c.documents, [category]: [...(c.documents[category] || []), newDoc] },
              pathwayEvents: [...(c.pathwayEvents || []), autoPathwayEvent]
            };
          }
          return c;
        }));
      };

      const handleAddWatchStudent = (e) => {
        e.preventDefault();
        const newStudent = {
          studentName: watchName.trim(),
          studentId: watchId.trim(),
          studentDob: watchDob,
          incidentGrade: watchGrade,
          schoolLocation: watchSchool.trim(),
          lastUpdatedDate: new Date().toLocaleDateString('en-US'),
          incidents: [
            {
              id: `inc-${Date.now()}`,
              tipsNum: watchTipsNum.trim() || 'Pending',
              details: watchDetails.trim() || 'No initial details logged.',
              date: watchDate,
              triage: watchTriage,
              resolution: watchResolution.trim() || 'Pending action',
              notes: watchNotes.trim() || 'No initial notes.',
              tipsDoc: null,
              recordsDocs: []
            }
          ]
        };

        setWatchStudents([newStudent, ...watchStudents]);
        setShowAddWatchModal(false);
        setWatchName(''); setWatchId(''); setWatchDob(''); setWatchSchool(''); setWatchTipsNum(''); setWatchDetails(''); setWatchResolution(''); setWatchNotes('');
      };

      const handleAddWatchIncident = (studentId) => {
        const tipsNum = prompt("Enter TIPS Report # for this new incident:");
        if (!tipsNum) return;

        const details = prompt("Enter Incident Details / Threat Description:");
        const date = prompt("Enter Incident Date:", new Date().toLocaleDateString('en-US'));
        const triage = prompt("Enter Triage Status:", "Low-Risk");
        const resolution = prompt("Enter Resolution / Action Taken:");
        const notes = prompt("Enter Notes / Update details:");

        const newIncident = {
          id: `inc-${Date.now()}`,
          tipsNum: tipsNum,
          details: details || 'No details provided',
          date: date || new Date().toLocaleDateString('en-US'),
          triage: triage || 'Low-Risk',
          resolution: resolution || 'Pending',
          notes: notes || 'None',
          tipsDoc: null,
          recordsDocs: []
        };

        setWatchStudents(watchStudents.map(st => {
          if (st.studentId === studentId) {
            return {
              ...st,
              lastUpdatedDate: new Date().toLocaleDateString('en-US'),
              incidents: [...st.incidents, newIncident]
            };
          }
          return st;
        }));
      };

      const handleWatchTipsUpload = (studentId, incidentId, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileUrl = URL.createObjectURL(file);

        setWatchStudents(watchStudents.map(st => {
          if (st.studentId === studentId) {
            return {
              ...st,
              incidents: st.incidents.map(inc => inc.id === incidentId ? { ...inc, tipsDoc: { name: file.name, url: fileUrl } } : inc)
            };
          }
          return st;
        }));
      };

      const handleWatchRecordsUpload = (studentId, incidentId, e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { id: `rd-${Date.now()}`, name: file.name, url: fileUrl };

        setWatchStudents(watchStudents.map(st => {
          if (st.studentId === studentId) {
            return {
              ...st,
              incidents: st.incidents.map(inc => inc.id === incidentId ? { ...inc, recordsDocs: [...(inc.recordsDocs || []), newDoc] } : inc)
            };
          }
          return st;
        }));
      };

      const handleCstagDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagDoc: newDoc } : c));
      };

      const handlePlanDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, planDoc: newDoc } : c));

        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? {

        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? {
          ...c,
          immediateResponse: { ...c.immediateResponse, [field]: !c.immediateResponse?.[field] }

        const existingStudentCase = cases.find(c =>

        if (existingStudentCase) {

            incidentDate: intakeIncidentDate,
            incidentGrade: intakeIncidentGrade,
            brief: intakeBrief.trim() || 'Additional TIPS threat report attached to existing student record.',
            doc: uploadedTipsFile ? { name: uploadedTipsFile.name, url: uploadedTipsFile.url } : null
          };

          const newDocEntry = uploadedTipsFile ? {
            id: `doc-${Date.now()}`,
            name: uploadedTipsFile.name,
            uploadDate: new Date().toISOString().split('T')[0],
            size: `${(uploadedTipsFile.file.size / 1024).toFixed(0)} KB`,
            url: uploadedTipsFile.url,
            isImage: false
          } : null;

          const updatedCases = cases.map(c => {
            if (c.id === existingStudentCase.id) {
              return {
                ...c,
                pastTovCount: (c.pastTovCount || 1) + 1,
                additionalTipsList: [...(c.additionalTipsList || []), newTipEntry],
                documents: {

                }

            return c;

          setCases(updatedCases);
          setSelectedCaseId(existingStudentCase.id);
          setShowNewIntakeModal(false);
          resetIntakeForm();

          return;

        const newCaseId = intakeTipsNum.trim() || `26-${Math.floor(1000 + Math.random() * 9000)}`;
        const newCase = {

          studentName: intakeStudentName.trim() || 'Unknown Student',

          caseTeamStatusLastUpdated: new Date().toISOString().split('T')[0],

          tipsReportNum: newCaseId,
          triagePriority: priority,
          triageCompleted: hasTriage,
          cstagClassification: 'Pending Assessment',
          cstagDoc: null,
          immediateResponse: { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false },
          planStatus: 'Waiting on team to schedule',
          planDoc: null,
          planStartDate: '',
          planEndDate: '',
          planCheckinDate: '',
          isIep: intakeIsIep,
          suspended: intakeSuspended,
          reEntryDate: intakeReEntryDate,
          caseStatus: 'Active',
          closeDate: '',
          closeNotes: '',
          closureReason: '',
          transferredSchoolName: '',
          primarySchoolReEntry: '',
          pastTovCount: 1,
          additionalTipsList: [],
          intakeFiles: {
            tipsPdf: uploadedTipsFile ? { name: uploadedTipsFile.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(uploadedTipsFile.file.size / 1024).toFixed(0)} KB`, url: uploadedTipsFile.url } : null,
            triagePdf: uploadedTriageFile ? { name: uploadedTriageFile.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(uploadedTriageFile.file.size / 1024).toFixed(0)} KB`, scoreDetected: detectedTriageScore, url: uploadedTriageFile.url } : null
          },
          documents: {
            studentInterview: [],
            parentInterview: [],
            witnessStatements: [],
            recordsReview: uploadedTipsFile ? [{ id: `doc-${Date.now()}`, name: uploadedTipsFile.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(uploadedTipsFile.file.size / 1024).toFixed(0)} KB`, url: uploadedTipsFile.url }] : []
          },
          pathwayEvents: [
            { id: 1, stage: 'Grievance', description: `TIPS Report Logged: ${intakeBrief.trim() || 'Initial threat statement.'}`, date: intakeIncidentDate, moveNote: '' }
          ]
        };

        setCases([newCase, ...cases]);
        setSelectedCaseId(newCase.id);
        setShowNewIntakeModal(false);
        resetIntakeForm();

        setUploadedTriageFile(null);

        setIntakeStudentDob('');
        setIntakeIncidentGrade('9th Grade');
        setIntakeSchool('');
        setIntakeVictimName('');
        setIntakeVictimRole('Student');
        setIntakeVictimOtherRoleDetails('');
        setIntakeInvolvedStudents('');
        setIntakeBrief('');
        setIntakeTipsNum('');
        setIntakeIsIep(false);
        setIntakeSuspended(false);
        setIntakeReEntryDate('');
      };

      const handleAddPathwayEvent = (e) => {
        e.preventDefault();
        if (!currentCase) return;

        const newEv = {
          id: Date.now(),
          stage: newEventStage,
          description: newEventDesc.trim(),
          date: newEventDate,
          moveNote: ''
        };

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: [...(c.pathwayEvents || []), newEv] } : c));
        setShowAddPathwayModal(false);
        setNewEventDesc('');
      };

      const handleUpdatePathwayEvent = (e) => {
        e.preventDefault();
        if (!currentCase || !editingPathwayEvent) return;

        setCases(cases.map(c => {
          if (c.id === currentCase.id) {
            return {
              ...c,
              pathwayEvents: c.pathwayEvents.map(ev => {
                if (ev.id === editingPathwayEvent.id) {
                  return {
                    ...ev,
                    stage: moveTargetStage,
                    moveNote: moveReasonNote.trim() ? `Moved to ${moveTargetStage}: ${moveReasonNote.trim()}` : ev.moveNote
                  };
                }
                return ev;
              })
            };
          }
          return c;
        }));

        setEditingPathwayEvent(null);
        setMoveReasonNote('');
      };

      const handleCloseCaseSubmit = (e) => {
        e.preventDefault();
        if (!currentCase) return;

        setCases(cases.map(c => c.id === currentCase.id ? {
          ...c,
          caseStatus: 'Closed',
          closeDate: closeCaseDate,
          closeNotes: closeCaseNotes.trim(),
          closureReason: closeCaseReason,
          transferredSchoolName: closeCaseReason === 'School Transfer' ? closeTransferredSchool.trim() : '',
          primarySchoolReEntry: closeCaseReason === 'School Transfer' ? closePrimaryReEntry : ''
        } : c));

        setShowCloseCaseModal(false);
        setCloseCaseNotes('');
        setCloseTransferredSchool('');
        setClosePrimaryReEntry('TBD');
      };

        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? {
          ...c,
          caseStatus: 'Active',
          closeDate: '',
          closeNotes: '',
          closureReason: '',
          transferredSchoolName: '',
          primarySchoolReEntry: ''
        } : c));

        setZoomLevel(1);
        setIsFullscreen(false);

                  <span className="bg-slate-800 text-xs text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700 font-mono">v2.6 Enterprise</span>

                className="w-full bg-slate-950 border border-slate-700 text-sm rounded-lg px-3 py-2 pl-9 focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-500"
              />
              <svg className="w-4 h-4 absolute left-3 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>

              {lookupResults.length > 0 && (
                <div className="absolute top-full left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-800">

                      <div className="text-xs text-slate-300 mt-1">{r.schoolLocation} • Current Grade: {calculateCurrentGrade(r.incidentGrade, r.incidentDate)}</div>
                      {r.involvedStudents && <div className="text-xs text-slate-500 truncate mt-0.5">Involved: {r.involvedStudents}</div>}

                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-purple-300">Add Student to Keeping an Eye On</h3>
                  <button onClick={() => setShowAddWatchModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddWatchStudent} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Student Name:</label>
                      <input
                        type="text"
                        required
                        value={watchName}
                        onChange={(e) => setWatchName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #:</label>
                      <input
                        type="text"
                        required
                        value={watchId}
                        onChange={(e) => setWatchId(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Birthday (DOB):</label>
                      <input
                        type="date"
                        required
                        value={watchDob}
                        onChange={(e) => setWatchDob(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Grade at Time of Incident:</label>
                      <select
                        value={watchGrade}
                        onChange={(e) => setWatchGrade(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      >
                        {GRADE_OPTIONS.map(g => (
                          <option key={g} value={g}>{g}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">School / Location:</label>
                    <input
                      type="text"
                      required
                      value={watchSchool}
                      onChange={(e) => setWatchSchool(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">TIPS Report #:</label>
                      <input
                        type="text"
                        value={watchTipsNum}
                        onChange={(e) => setWatchTipsNum(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                        placeholder="e.g. 26-03007"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Incident Date:</label>
                      <input
                        type="date"
                        value={watchDate}
                        onChange={(e) => setWatchDate(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Incident Details / Behavior:</label>
                    <textarea
                      rows="3"
                      value={watchDetails}
                      onChange={(e) => setWatchDetails(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="Description of concern..."
                    ></textarea>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Resolution / Action Taken:</label>
                    <input
                      type="text"
                      value={watchResolution}
                      onChange={(e) => setWatchResolution(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="e.g. Parent conference, OSS"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Notes / Context:</label>
                    <input
                      type="text"
                      value={watchNotes}
                      onChange={(e) => setWatchNotes(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="e.g. Monitor cafeteria interactions"
                    />
                  </div>

                  <div className="pt-3 flex justify-end space-x-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowAddWatchModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold"
                    >
                      Add to Watch Log
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. ADD PATHWAY INDICATOR MODAL */}
          {showAddPathwayModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-200">Add Pathway Indicator</h3>
                  <button onClick={() => setShowAddPathwayModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleAddPathwayEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Pathway Stage:</label>
                    <select
                      value={newEventStage}
                      onChange={(e) => setNewEventStage(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100 font-semibold"
                    >
                      {PATHWAY_STAGES.map(s => (
                        <option key={s.key} value={s.key}>{s.label}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Date Logged:</label>
                    <input
                      type="date"
                      value={newEventDate}
                      onChange={(e) => setNewEventDate(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Behavior / Indicator Description:</label>
                    <textarea
                      required
                      rows="3"
                      value={newEventDesc}
                      onChange={(e) => setNewEventDesc(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="Specific behavior observed..."
                    ></textarea>
                  </div>

                  <div className="pt-3 flex justify-end space-x-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowAddPathwayModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold"
                    >
                      Save Indicator
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 5. EDIT PATHWAY STAGE MODAL */}
          {editingPathwayEvent && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-slate-200">Reclassify Pathway Stage</h3>
                  <button onClick={() => setEditingPathwayEvent(null)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleUpdatePathwayEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Move Indicator To Stage:</label>
                    <select
                      value={moveTargetStage}
                      onChange={(e) => setMoveTargetStage(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100 font-semibold"
                    >
                      {PATHWAY_STAGES.map(s => (
                        <option key={s.key} value={s.key}>{s.label}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Reason for Stage Reclassification:</label>
                    <textarea
                      rows="3"
                      value={moveReasonNote}
                      onChange={(e) => setMoveReasonNote(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="Explain why this behavior moved stages..."
                    ></textarea>
                  </div>

                  <div className="pt-3 flex justify-end space-x-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setEditingPathwayEvent(null)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold"
                    >
                      Update Stage
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 6. CLOSE CASE MODAL (With School Transfer & Incident Grade Preservation) */}
          {showCloseCaseModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-base text-red-300">Close Case File</h3>
                  <button onClick={() => setShowCloseCaseModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={handleCloseCaseSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Close Date:</label>
                    <input
                      type="date"
                      value={closeCaseDate}
                      onChange={(e) => setCloseCaseDate(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-semibold">Closure Reason:</label>
                    <select
                      value={closeCaseReason}
                      onChange={(e) => setCloseCaseReason(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100 font-semibold"
                    >
                      <option value="Case Resolved / Plan Completed">Case Resolved / Safety Plan Completed</option>
                      <option value="Not-a-Threat / False Report">Not-a-Threat / False Report</option>
                      <option value="School Transfer">School Transfer</option>
                      <option value="Student Graduated">Student Graduated</option>
                      <option value="Moved Out of District">Moved Out of District</option>
                      <option value="Alternative Placement">Alternative Placement</option>
                    </select>
                  </div>

                  {/* Dynamic Transfer Box when "School Transfer" is selected */}
                  {closeCaseReason === 'School Transfer' && (
                    <div className="bg-slate-950 p-3 rounded-lg border border-yellow-700/60 space-y-3">
                      <div>
                        <label className="text-yellow-300 block mb-1 font-bold">Transferred School Option / Destination:</label>
                        <input
                          type="text"
                          required
                          value={closeTransferredSchool}
                          onChange={(e) => setCloseTransferredSchool(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-100"
                          placeholder="e.g. Mid-Del Schools, Charter Academy, Virtual Online"
                        />
                      </div>

                      <div>
                        <label className="text-yellow-300 block mb-1 font-bold">Will student be re-entering their primary school?</label>
                        <select
                          value={closePrimaryReEntry}
                          onChange={(e) => setClosePrimaryReEntry(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-100 font-semibold"
                        >
                          <option value="Yes">Yes</option>
                          <option value="No">No</option>
                          <option value="TBD">TBD (To Be Determined)</option>
                        </select>
                      </div>
                    </div>
                  )}

                  <div className="bg-slate-950 p-2.5 rounded border border-slate-800 text-[11px] text-slate-400">
                    ℹ️ Grade at incident (<strong className="text-white">{currentCase?.incidentGrade || 'Current Grade'}</strong>) will remain permanently recorded in archives.
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Closure Resolution Notes:</label>
                    <textarea
                      required
                      rows="3"
                      value={closeCaseNotes}
                      onChange={(e) => setCloseCaseNotes(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-100"
                      placeholder="Detail why this case is ready for archive..."
                    ></textarea>
                  </div>

                  <div className="pt-3 flex justify-end space-x-3 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setShowCloseCaseModal(false)}
                      className="px-4 py-2 bg-slate-800 text-slate-300 rounded font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-red-600 hover:bg-red-500 text-white rounded font-bold"
                    >
                      Archive & Close Case
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
