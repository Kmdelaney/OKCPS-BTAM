<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKCPS Behavioral Threat Assessment System</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const PATHWAY_STAGES = [
      { key: 'Grievance', label: 'Grievance', color: 'bg-blue-900 text-blue-200 border-blue-600' },
      { key: 'Violent Ideation', label: 'Violent Ideation', color: 'bg-teal-900 text-teal-200 border-teal-600' },
      { key: 'Research & Planning', label: 'Research & Planning', color: 'bg-yellow-900 text-yellow-200 border-yellow-600' },
      { key: 'Preparation', label: 'Preparation', color: 'bg-purple-900 text-purple-200 border-purple-600' },
      { key: 'Probing/Breaching', label: 'Probing / Breaching', color: 'bg-pink-900 text-pink-200 border-pink-600' },
      { key: 'Attack', label: 'Attack', color: 'bg-red-900 text-red-200 border-red-600' }
    ];

    const createMockPdfBlobUrl = (title, details) => {
      const pdfContent = `%PDF-1.4\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n4 0 obj\n<< /Length 120 >>\nstream\nBT\n/F1 16 Tf\n50 700 Td\n(${title}) Tj\n0 -30 Td\n/F1 10 Tf\n(${details}) Tj\nET\nendstream\nendobj\n5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\nxref\n0 6\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000244 00000 n \n0000000415 00000 n \ntrailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n492\n%%EOF`;
      const blob = new Blob([pdfContent], { type: 'application/pdf' });
      return URL.createObjectURL(blob);
    };

    const INITIAL_CASES = [
      {
        id: '26-03093',
        studentName: 'Jorge Jimenez',
        studentId: '345290',
        schoolLocation: 'Capitol Hill High School',
        tovBrief: 'Reported online threats, firearm-related imagery on Instagram highlights, and alleged stalking/intimidation behavior toward peers.',
        incidentDate: '2026-09-04',
        dateReported: '2026-09-07',
        tipsReportNum: '26-03093',
        triagePriority: 'High',
        triageCompleted: true,
        cstagClassification: 'Very Serious Substantive',
        cstagDoc: { name: 'CSTAG_Determination_Jimenez_VSS.pdf', uploadDate: '2026-09-08', size: '740 KB', url: createMockPdfBlobUrl('CSTAG Determination', 'Classification: Very Serious Substantive') },
        immediateResponse: { victimNotification: true, vulnerabilityReduction: true, conflictResolution: false },
        planStatus: 'Support Plan Created',
        planDoc: { name: 'Safety_Plan_Jorge_Jimenez.pdf', uploadDate: '2026-09-08', size: '1.2 MB', url: createMockPdfBlobUrl('Safety Plan', 'Student Safety Plan') },
        planStartDate: '2026-09-08',
        planEndDate: '2026-12-18',
        planCheckinDate: '2026-10-12',
        isIep: false,
        suspended: true,
        reEntryDate: '2026-09-21',
        caseStatus: 'Active',
        closeDate: '',
        lastTeamContactDate: '2026-09-08',
        teamReachoutCount: 3,
        pastTovCount: 1,
        previousTovHistory: [{ date: '2026-08-28', brief: 'Stolen ring incident resulting in OSS discipline.', actionTaken: 'OSS Assigned' }],
        intakeFiles: {
          tipsPdf: { name: 'TIPS_Report_26-03093_Jimenez.pdf', uploadDate: '2026-09-07', size: '1.4 MB', url: createMockPdfBlobUrl('TIPS Report #26-03093', 'Subject: Jorge Jimenez (ID: 345290)') },
          triagePdf: { name: 'JJ_Triage_HIGH.pdf', uploadDate: '2026-09-07', size: '620 KB', scoreDetected: 'High', url: createMockPdfBlobUrl('Triage Form: JJ Triage - HIGH', 'Assessment: Very Serious Substantive Threat.') }
        },
        documents: {
          studentInterview: [{ name: 'Jorge_Jimenez_Statement.pdf', uploadDate: '2026-09-08', size: '1.1 MB', url: createMockPdfBlobUrl('Student Statement', 'Jorge Jimenez interview notes.') }],
          parentInterview: [],
          witnessStatements: [{ name: 'Witness_Statement_Erick_Ruben.pdf', uploadDate: '2026-09-07', size: '890 KB', url: createMockPdfBlobUrl('Witness Statement', 'Erick Ruben witness report.') }],
          recordsReview: [{ name: 'Instagram_Firearm_Screenshots.pdf', uploadDate: '2026-09-07', size: '4.2 MB', url: createMockPdfBlobUrl('Evidence', 'Instagram highlights screenshots.') }]
        },
        pathwayEvents: [
          { id: 1, stage: 'Grievance', description: 'Peer dispute involving stolen ring during physical education class.', date: '2026-08-28' },
          { id: 2, stage: 'Violent Ideation', description: 'Instagram highlights updated showing subject posing with firearms.', date: '2026-09-05' },
          { id: 3, stage: 'Probing/Breaching', description: 'Targeted peers reported feeling watched and followed after school.', date: '2026-09-07' }
        ]
      },
      {
        id: '26-02602',
        studentName: 'Jesus Garcia-Reyes',
        studentId: '332545',
        schoolLocation: 'U.S. Grant HS',
        tovBrief: '"Raymond does not deserve to live"',
        incidentDate: '2026-08-12',
        dateReported: '2026-08-12',
        tipsReportNum: '26-02602',
        triagePriority: 'High',
        triageCompleted: true,
        cstagClassification: 'Very Serious Substantive',
        cstagDoc: null,
        immediateResponse: { victimNotification: true, vulnerabilityReduction: false, conflictResolution: false },
        planStatus: 'Meeting Scheduled',
        planDoc: null,
        planStartDate: '',
        planEndDate: '',
        planCheckinDate: '',
        isIep: true,
        suspended: true,
        reEntryDate: '2026-08-27',
        caseStatus: 'Monitored',
        closeDate: '',
        lastTeamContactDate: '2026-09-16',
        teamReachoutCount: 4,
        pastTovCount: 0,
        previousTovHistory: [],
        intakeFiles: {
          tipsPdf: { name: 'TIPS_26-02602_GarciaReyes.pdf', uploadDate: '2026-08-12', size: '1.2 MB', url: createMockPdfBlobUrl('TIPS Report #26-02602', 'Subject: Jesus Garcia-Reyes') },
          triagePdf: { name: 'Triage_Worksheet_GarciaReyes_HIGH.pdf', uploadDate: '2026-08-12', size: '580 KB', scoreDetected: 'High', url: createMockPdfBlobUrl('Triage Form', 'Risk Score: High') }
        },
        documents: {
          studentInterview: [{ name: 'Student_Interview_0812.pdf', uploadDate: '2026-08-13', size: '1.2 MB', url: createMockPdfBlobUrl('Interview', 'Student Interview notes.') }],
          parentInterview: [{ name: 'Parent_Contact_Notes.pdf', uploadDate: '2026-08-13', size: '850 KB', url: createMockPdfBlobUrl('Parent Contact', 'Parent interview notes.') }],
          witnessStatements: [{ name: 'Witness_Statement_Raymond.pdf', uploadDate: '2026-08-14', size: '500 KB', url: createMockPdfBlobUrl('Witness', 'Raymond statement.') }],
          recordsReview: [{ name: 'CRC_Hospital_Release_Summary.pdf', uploadDate: '2026-08-25', size: '2.4 MB', url: createMockPdfBlobUrl('Records', 'Hospital summary.') }]
        },
        pathwayEvents: [
          { id: 1, stage: 'Grievance', description: 'Verbal confrontation with student Raymond in cafeteria line.', date: '2026-08-10' },
          { id: 2, stage: 'Violent Ideation', description: 'Stated directly to peer: "Raymond does not deserve to live".', date: '2026-08-12' }
        ]
      },
      {
        id: '26-02880',
        studentName: 'Elijah Jameson',
        studentId: '1071436',
        schoolLocation: 'Skyline MS',
        tovBrief: '"I\'m gonna have my Grandma come up to the school and shoot you."',
        incidentDate: '2026-08-26',
        dateReported: '2026-08-27',
        tipsReportNum: '26-02880',
        triagePriority: 'Medium',
        triageCompleted: true,
        cstagClassification: 'Transient Threat',
        cstagDoc: null,
        immediateResponse: { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false },
        planStatus: 'Support Plan Created',
        planDoc: { name: 'Support_Plan_Elijah.pdf', uploadDate: '2026-09-30', size: '890 KB', url: createMockPdfBlobUrl('Support Plan', 'Transient Threat Support Plan') },
        planStartDate: '2026-09-30',
        planEndDate: '2026-11-30',
        planCheckinDate: '2026-10-14',
        isIep: false,
        suspended: true,
        reEntryDate: '2026-09-03',
        caseStatus: 'Active',
        closeDate: '',
        lastTeamContactDate: '2026-10-05',
        teamReachoutCount: 2,
        pastTovCount: 0,
        previousTovHistory: [],
        intakeFiles: {
          tipsPdf: { name: 'TIPS_26-02880_Jameson.pdf', uploadDate: '2026-08-27', size: '1.1 MB', url: createMockPdfBlobUrl('TIPS Report #26-02880', 'Subject: Elijah Jameson') },
          triagePdf: { name: 'Triage_Form_Jameson_MED.pdf', uploadDate: '2026-08-27', size: '510 KB', scoreDetected: 'Medium', url: createMockPdfBlobUrl('Triage Form', 'Risk Score: Medium') }
        },
        documents: {
          studentInterview: [{ name: 'Elijah_Student_Interview.pdf', uploadDate: '2026-08-28', size: '1.0 MB', url: createMockPdfBlobUrl('Student Interview', 'Elijah statement.') }],
          parentInterview: [],
          witnessStatements: [{ name: 'Staff_Witness_Statement.pdf', uploadDate: '2026-08-28', size: '650 KB', url: createMockPdfBlobUrl('Witness Statement', 'Staff report.') }],
          recordsReview: [{ name: 'Elijah_Behavior_Logs.pdf', uploadDate: '2026-10-05', size: '2.0 MB', url: createMockPdfBlobUrl('Records Review', 'Behavior logs.') }]
        },
        pathwayEvents: [
          { id: 1, stage: 'Grievance', description: 'Disciplinary encounter with hall monitor over phone confiscation.', date: '2026-08-26' },
          { id: 2, stage: 'Violent Ideation', description: 'Threatened shooting via family member in main office.', date: '2026-08-26' }
        ]
      }
    ];

    function App() {
      const [cases, setCases] = useState(INITIAL_CASES);
      const [mainTab, setMainTab] = useState('active'); // active, planTab, low, noTriage, closed, dashboard
      const [selectedCaseId, setSelectedCaseId] = useState(INITIAL_CASES[0].id);
      const [activeDocTab, setActiveDocTab] = useState('studentInterview');

      // Viewer Modal
      const [viewingDoc, setViewingDoc] = useState(null);

      // Modals
      const [showNewIntakeModal, setShowNewIntakeModal] = useState(false);
      const [showCloseCaseModal, setShowCloseCaseModal] = useState(false);
      const [showAddPathwayModal, setShowAddPathwayModal] = useState(false);

      // Pathway Add Form
      const [newEventStage, setNewEventStage] = useState('Grievance');
      const [newEventDesc, setNewEventDesc] = useState('');
      const [newEventDate, setNewEventDate] = useState(new Date().toISOString().split('T')[0]);

      // Close Case Form
      const [closeCaseDate, setCloseCaseDate] = useState(new Date().toISOString().split('T')[0]);
      const [closeCaseNotes, setCloseCaseNotes] = useState('');

      // New Intake Uploads
      const [uploadedTipsFile, setUploadedTipsFile] = useState(null);
      const [uploadedTriageFile, setUploadedTriageFile] = useState(null);
      const [detectedTriageScore, setDetectedTriageScore] = useState('Pending Triage');

      // Intake Fields
      const [intakeStudentName, setIntakeStudentName] = useState('');
      const [intakeStudentId, setIntakeStudentId] = useState('');
      const [intakeSchool, setIntakeSchool] = useState('');
      const [intakeBrief, setIntakeBrief] = useState('');
      const [intakeTipsNum, setIntakeTipsNum] = useState('');
      const [intakeIsIep, setIntakeIsIep] = useState(false);
      const [intakeSuspended, setIntakeSuspended] = useState(false);
      const [intakeReEntryDate, setIntakeReEntryDate] = useState('');

      // Filtered Case Categories
      const activeMediumHighCases = cases.filter(c => c.triageCompleted && (c.triagePriority === 'Medium' || c.triagePriority === 'High') && c.caseStatus !== 'Closed');
      const casesOnPlan = cases.filter(c => c.planStartDate && c.planStartDate.trim() !== '' && c.caseStatus !== 'Closed');
      const lowRiskCases = cases.filter(c => c.triageCompleted && c.triagePriority === 'Low' && c.caseStatus !== 'Closed');
      const openNoTriageCases = cases.filter(c => !c.triageCompleted && c.caseStatus !== 'Closed');
      const closedCases = cases.filter(c => c.caseStatus === 'Closed');

      const currentCase = cases.find(c => c.id === selectedCaseId) || activeMediumHighCases[0] || cases[0];

      // AUTO-GENERATE PATHWAY EVENT ON 360 DOCUMENT UPLOAD
      const handleFileUpload = (category, e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;

        const fileUrl = URL.createObjectURL(file);
        const newDoc = {
          name: file.name,
          uploadDate: new Date().toISOString().split('T')[0],
          size: `${(file.size / 1024).toFixed(0)} KB`,
          url: fileUrl
        };

        // Map Category to Pathway Stage
        let mappedStage = 'Grievance';
        if (category === 'studentInterview') mappedStage = 'Violent Ideation';
        else if (category === 'parentInterview') mappedStage = 'Research & Planning';
        else if (category === 'witnessStatements') mappedStage = 'Preparation';
        else if (category === 'recordsReview') mappedStage = 'Probing/Breaching';

        const autoPathwayEvent = {
          id: Date.now(),
          stage: mappedStage,
          description: `Auto-Logged via 360 Upload (${category.replace(/([A-Z])/g, ' $1')}): ${file.name}`,
          date: new Date().toISOString().split('T')[0]
        };

        const updatedCases = cases.map(c => {
          if (c.id === currentCase.id) {
            return {
              ...c,
              documents: {
                ...c.documents,
                [category]: [...(c.documents[category] || []), newDoc]
              },
              pathwayEvents: [...(c.pathwayEvents || []), autoPathwayEvent]
            };
          }
          return c;
        });

        setCases(updatedCases);
      };

      // Upload CSTAG Determination Document
      const handleCstagDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagDoc: newDoc } : c));
      };

      // Upload Plan Document
      const handlePlanDocUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !currentCase) return;
        const fileUrl = URL.createObjectURL(file);
        const newDoc = { name: file.name, uploadDate: new Date().toISOString().split('T')[0], size: `${(file.size / 1024).toFixed(0)} KB`, url: fileUrl };

        setCases(cases.map(c => c.id === currentCase.id ? { ...c, planDoc: newDoc } : c));
      };

      // Update CSTAG Determination
      const handleCstagChange = (classification) => {
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, cstagClassification: classification } : c));
      };

      // Toggle Immediate Response Checklist
      const toggleImmediateCheck = (field) => {
        if (!currentCase) return;
        const currentChecks = currentCase.immediateResponse || { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false };
        const updatedChecks = { ...currentChecks, [field]: !currentChecks[field] };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, immediateResponse: updatedChecks } : c));
      };

      // Update Plan Details
      const updatePlanDetail = (field, val) => {
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, [field]: val } : c));
      };

      // Add Manual Pathway Event
      const handleAddPathwayEvent = (e) => {
        e.preventDefault();
        if (!newEventDesc.trim() || !currentCase) return;

        const newEvent = { id: Date.now(), stage: newEventStage, description: newEventDesc, date: newEventDate };
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, pathwayEvents: [...(c.pathwayEvents || []), newEvent] } : c));
        setShowAddPathwayModal(false);
        setNewEventDesc('');
      };

      // Intake Upload Handlers
      const handleTipsFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const fileUrl = URL.createObjectURL(file);
          setUploadedTipsFile({ file, url: fileUrl, name: file.name });
          setTimeout(() => {
            setIntakeStudentName('Jorge Jimenez'); setIntakeStudentId('345290'); setIntakeSchool('Capitol Hill High School');
            setIntakeTipsNum('26-03093'); setIntakeBrief('Reported online threats and firearm imagery.'); setIntakeSuspended(true); setIntakeReEntryDate('2026-09-21');
          }, 300);
        }
      };

      const handleTriageFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const fileUrl = URL.createObjectURL(file);
          setUploadedTriageFile({ file, url: fileUrl, name: file.name });
          setTimeout(() => {
            const fname = file.name.toUpperCase();
            if (fname.includes('HIGH')) setDetectedTriageScore('High');
            else if (fname.includes('MED')) setDetectedTriageScore('Medium');
            else if (fname.includes('LOW')) setDetectedTriageScore('Low');
            else setDetectedTriageScore('High');
          }, 300);
        }
      };

      const handleCreateCase = (e) => {
        e.preventDefault();
        const pastMatches = cases.filter(c => c.studentId === intakeStudentId && intakeStudentId.trim() !== '');

        const autoRecordsDocs = [];
        if (pastMatches.length > 0) {
          autoRecordsDocs.push({
            name: `Prior_System_Incident_Summary_ID_${intakeStudentId}.pdf`, uploadDate: new Date().toISOString().split('T')[0], size: '520 KB',
            url: createMockPdfBlobUrl(`Prior Records Summary - Student ID #${intakeStudentId}`, `Found ${pastMatches.length} historical case records.`)
          });
        }

        const isTriageProvided = !!uploadedTriageFile;
        const finalPriority = isTriageProvided ? detectedTriageScore : 'Pending Triage';

        const newCase = {
          id: intakeTipsNum || `26-${Math.floor(1000 + Math.random() * 9000)}`,
          studentName: intakeStudentName, studentId: intakeStudentId, schoolLocation: intakeSchool || 'OKCPS Campus',
          tovBrief: intakeBrief, incidentDate: new Date().toISOString().split('T')[0], dateReported: new Date().toISOString().split('T')[0],
          tipsReportNum: intakeTipsNum, triagePriority: finalPriority, triageCompleted: isTriageProvided,
          cstagClassification: !isTriageProvided ? 'Pending Assessment' : finalPriority === 'Low' ? 'Not-A-Threat' : 'Serious Substantive',
          cstagDoc: null, immediateResponse: { victimNotification: false, vulnerabilityReduction: false, conflictResolution: false },
          planStatus: 'Not Completed', planDoc: null, planStartDate: '', planEndDate: '', planCheckinDate: '',
          isIep: intakeIsIep, suspended: intakeSuspended, reEntryDate: intakeSuspended ? (intakeReEntryDate || 'Pending') : 'N/A',
          caseStatus: 'Active', closeDate: '', lastTeamContactDate: new Date().toISOString().split('T')[0], teamReachoutCount: 1,
          pastTovCount: pastMatches.length, previousTovHistory: pastMatches.map(m => ({ date: m.incidentDate, brief: m.tovBrief, actionTaken: m.supportPlanStatus })),
          intakeFiles: {
            tipsPdf: uploadedTipsFile ? { name: uploadedTipsFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '1.2 MB', url: uploadedTipsFile.url } : null,
            triagePdf: uploadedTriageFile ? { name: uploadedTriageFile.name, uploadDate: new Date().toISOString().split('T')[0], size: '540 KB', scoreDetected: finalPriority, url: uploadedTriageFile.url } : null
          },
          documents: { studentInterview: [], parentInterview: [], witnessStatements: [], recordsReview: autoRecordsDocs },
          pathwayEvents: (isTriageProvided && finalPriority !== 'Low') ? [{ id: Date.now(), stage: 'Grievance', description: `Initial threat logged via TIPS #${intakeTipsNum}`, date: new Date().toISOString().split('T')[0] }] : []
        };

        setCases([newCase, ...cases]);
        setSelectedCaseId(newCase.id);
        setShowNewIntakeModal(false);
        setUploadedTipsFile(null); setUploadedTriageFile(null); setDetectedTriageScore('Pending Triage');

        if (!isTriageProvided) setMainTab('noTriage');
        else if (finalPriority === 'Low') setMainTab('low');
        else setMainTab('active');
      };

      const handleConfirmCloseCase = () => {
        if (!currentCase) return;
        setCases(cases.map(c => c.id === currentCase.id ? { ...c, caseStatus: 'Closed', closeDate: closeCaseDate, supportPlanStatus: `Closed (${closeCaseDate}): ${closeCaseNotes}` } : c));
        setShowCloseCaseModal(false); setCloseCaseNotes(''); setMainTab('closed');
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
          {/* HEADER BAR */}
          <header className="border-b border-slate-800 bg-slate-900/90 sticky top-0 z-40 backdrop-blur">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-blue-600/20 text-blue-400 rounded-lg font-bold text-lg">🛡️</div>
                <div>
                  <h1 className="text-base font-bold text-slate-100">OKCPS Behavioral Threat Assessment System</h1>
                  <p className="text-[11px] text-slate-400">CSTAG Protocol Engine • FERPA & HIPAA Compliant</p>
                </div>
              </div>

              <button onClick={() => setShowNewIntakeModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-all shadow-md shadow-blue-600/20">
                + New Threat Intake (TIPS & Triage PDF)
              </button>
            </div>
          </header>

          {/* EMERGENCY ALERT BANNERS */}
          {currentCase?.triagePriority === 'High' && mainTab !== 'dashboard' && currentCase.caseStatus !== 'Closed' && (
            <div className="bg-red-950/90 border-b border-red-800 text-red-200 px-4 py-2 text-xs flex items-center justify-between animate-pulse">
              <div className="max-w-7xl mx-auto w-full flex items-center space-x-2">
                <span className="text-red-400 font-bold">⚠️</span>
                <span className="font-semibold">HIGH RISK ASSESSMENT ACTIVE: Automated Dispatch Notification routed to District Security (405-587-SAFE) & Mental Health.</span>
              </div>
            </div>
          )}

          {currentCase?.isIep && mainTab !== 'dashboard' && currentCase.caseStatus !== 'Closed' && (
            <div className="bg-amber-950/90 border-b border-amber-800 text-amber-200 px-4 py-2 text-xs">
              <div className="max-w-7xl mx-auto w-full flex items-center space-x-2 font-semibold">
                <span className="text-amber-400">🔒</span>
                <span>AUTOMATED IEP / OESS ALERT: OESS MUST be consulted for all students on an IEP.</span>
              </div>
            </div>
          )}

          {/* NAVIGATION TABS WITH CASE COUNTERS */}
          <div className="max-w-7xl mx-auto px-4 pt-4">
            <div className="flex border-b border-slate-800 space-x-6 text-xs font-semibold overflow-x-auto">

                                    <label className="text-slate-400 block mb-1">Next Progress Check-in Date</label>

              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-slate-100">Add Pathway Event</h3>
                  <button onClick={() => setShowAddPathwayModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <form onSubmit={handleAddPathwayEvent} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Select Stage</label>
                    <select value={newEventStage} onChange={(e) => setNewEventStage(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100">
                      {PATHWAY_STAGES.map(s => <option key={s.key} value={s.key}>{s.label}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Description</label>
                    <textarea rows="3" required value={newEventDesc} onChange={(e) => setNewEventDesc(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Incident Date</label>
                    <input type="date" required value={newEventDate} onChange={(e) => setNewEventDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowAddPathwayModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-semibold">Save Event</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* NEW INTAKE MODAL */}
          {showNewIntakeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-base font-bold text-slate-100">New Threat Intake</h3>
                  <button onClick={() => setShowNewIntakeModal(false)} className="text-slate-400 hover:text-white font-bold">✕</button>
                </div>
                <form onSubmit={handleCreateCase} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <p className="font-semibold text-slate-200 mb-1">Upload TIPS Report PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTipsFileUpload} className="text-xs text-slate-400 w-full" />
                    </div>
                    <div className="border-2 border-dashed border-slate-700 p-4 rounded-lg text-center bg-slate-950/50">
                      <p className="font-semibold text-slate-200 mb-1">Upload Threat Triage PDF</p>
                      <input type="file" accept="application/pdf" onChange={handleTriageFileUpload} className="text-xs text-slate-400 w-full" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Student Name</label>
                      <input type="text" required value={intakeStudentName} onChange={(e) => setIntakeStudentName(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Student ID #</label>
                      <input type="text" required value={intakeStudentId} onChange={(e) => setIntakeStudentId(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Threat Brief</label>
                    <textarea rows="2" value={intakeBrief} onChange={(e) => setIntakeBrief(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" onClick={() => setShowNewIntakeModal(false)} className="bg-slate-800 px-4 py-2 rounded text-slate-300 font-semibold">Cancel</button>
                    <button type="submit" className="bg-blue-600 text-white px-5 py-2 rounded font-semibold">Initialize Case</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CLOSE CASE MODAL */}
          {showCloseCaseModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-100">Close Case & Archive</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Close Date</label>
                    <input type="date" required value={closeCaseDate} onChange={(e) => setCloseCaseDate(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-slate-100" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Resolution Notes</label>
                    <textarea rows="3" required value={closeCaseNotes} onChange={(e) => setCloseCaseNotes(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-slate-100" />
                  </div>
                </div>
                <div className="flex justify-end space-x-2 pt-3 border-t border-slate-800">
                  <button onClick={() => setShowCloseCaseModal(false)} className="bg-slate-800 text-slate-300 px-4 py-2 rounded font-semibold">Cancel</button>
                  <button onClick={handleConfirmCloseCase} className="bg-red-600 text-white px-4 py-2 rounded font-semibold">Confirm & Archive</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
